<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>LIGHT LAG</title>
<style>
:root {
  --bg: #050a17; --panel: #0c1428; --panel2: #121c35; --line: rgba(160,185,230,0.16);
  --text: #dfe6f2; --body: #c9d3e6; --dim: #8e9bb5; --gold: #f3d68c; --home: #fff3d6; --violet: #b993ff; --teal: #4fd8c8;
  --amber: #ffb547; --blue: #a8d2ff; --green: #c9f2dd;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; -webkit-user-select: none; user-select: none; touch-action: manipulation; overscroll-behavior: none; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; opacity: 0.4; }
button:focus-visible { outline: 2px solid rgba(255,243,214,0.6); outline-offset: 2px; }
.hidden { display: none !important; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; padding: var(--sat) var(--sar) var(--sab) var(--sal); max-width: 560px; margin: 0 auto; }

/* top bar */
#top { position: relative; height: 48px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 2px 0 14px; }
#lvlname { flex: 1; min-width: 0; text-align: left; font-weight: 650; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 44px; letter-spacing: 0.01em; }
#lvlname .n { color: var(--dim); font-weight: 500; margin-right: 7px; font-variant-numeric: tabular-nums; }
#lvlname.tight { font-size: 14px; letter-spacing: 0; }
#lvlname.tight .n { display: none; }
#year { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; line-height: 1; min-width: 42px; font-variant-numeric: tabular-nums; }
#year .k { font-size: 9.5px; letter-spacing: 0.2em; color: var(--dim); margin: 0 -0.2em 3px 0; }
#year b { color: var(--home); font-size: 20px; font-weight: 700; display: inline-block; }
#year b.roll { animation: roll 0.38s cubic-bezier(.2,.8,.3,1); }
@keyframes roll { from { transform: translateY(-7px); opacity: 0.15; } to { transform: none; opacity: 1; } }
#tickbar { position: absolute; left: 14px; right: 14px; bottom: 0; height: 1px; background: linear-gradient(90deg, rgba(255,243,214,0), rgba(255,243,214,0.55)); transform-origin: left center; transform: scaleX(1); opacity: 0; transition: opacity 0.6s ease; pointer-events: none; }
#tickbar.on { opacity: 1; transition: none; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.iconbtn:active { background: var(--panel2); }
.burger, .burger::before, .burger::after { display: block; width: 18px; height: 2px; border-radius: 1px; background: var(--text); position: relative; }
.burger::before, .burger::after { content: ''; position: absolute; left: 0; }
.burger::before { top: -6px; } .burger::after { top: 6px; }

/* objective strip */
#obj { flex: none; display: flex; align-items: center; gap: 10px; text-align: left; padding: 0 14px; min-height: 44px; color: var(--text); font-size: 15px; line-height: 1.3; }
#objtext { flex: 1; min-width: 0; }
#obj .i { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(160,185,230,0.35); color: var(--dim); font: italic 600 13px/20px Georgia, "Times New Roman", serif; text-align: center; }
#obj:active .i { background: var(--panel2); color: var(--text); }

/* board */
#boardwrap { flex: 1 1 auto; min-height: 140px; position: relative; }
#board { display: block; margin: 0 auto; touch-action: none; }
#float { position: absolute; left: 10px; right: 10px; bottom: 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 2; }
#coach { pointer-events: auto; width: 100%; background: rgba(10,17,35,0.96); border: 1px solid rgba(255,243,214,0.28); border-left: 3px solid var(--home); color: var(--home); border-radius: 12px; padding: 10px 14px 10px 13px; font-size: 15px; line-height: 1.38; box-shadow: 0 8px 28px rgba(0,0,0,0.55); animation: rise 0.32s cubic-bezier(.2,.8,.3,1); }
#coach .lead { color: var(--teal); font-weight: 650; }
#coach.snug { font-size: 13px; line-height: 1.3; padding: 6px 10px 6px 10px; }
#coach .kick { display: block; color: var(--teal); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 4px; }
#coach .more { display: block; color: var(--dim); font-size: 11px; margin-top: 5px; letter-spacing: 0.14em; }
#coach.tap { cursor: pointer; }
#toast { background: rgba(18,28,53,0.97); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; font-size: 15px; color: var(--text); max-width: 100%; text-align: center; animation: rise 0.22s ease; box-shadow: 0 6px 20px rgba(0,0,0,0.45); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* dock */
#dock { flex: none; padding: 4px 10px 8px; display: flex; flex-direction: column; gap: 6px; }
#log { display: flex; align-items: center; gap: 10px; text-align: left; height: 56px; padding: 0 10px 0 12px; border-radius: 12px; background: rgba(12,20,40,0.7); border: 1px solid var(--line); }
#log .sym { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--home); opacity: 0.55; box-shadow: 0 0 6px rgba(255,243,214,0.5); }
#log.fresh .sym { animation: ping 1.1s ease-out; }
@keyframes ping { 0% { opacity: 1; box-shadow: 0 0 0 0 rgba(255,243,214,0.7); } 100% { opacity: 0.55; box-shadow: 0 0 0 9px rgba(255,243,214,0); } }
#logtext { flex: 1; min-width: 0; font-size: 15px; color: var(--body); line-height: 1.32; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#logtext.fresh { animation: fade 0.45s ease; }
#logact:empty { display: none; }
#logact { flex: none; }
#logact button { min-height: 44px; padding: 0 12px; border-radius: 11px; background: var(--home); color: #1b1408; font-weight: 700; font-size: 14px; white-space: nowrap; animation: rise 0.3s ease; }
#outbox, #chips { display: flex; flex-wrap: nowrap; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; height: 44px; align-items: center; }
#outbox::-webkit-scrollbar, #chips::-webkit-scrollbar { display: none; }
#outbox > *, #chips > * { flex: none; }
#chips > .answerBtn { flex: 1; }
#outbox:empty, #chips:empty { display: none; }
.chip { height: 44px; min-width: 44px; justify-content: center; padding: 0 13px; border-radius: 22px; border: 1px solid var(--line); background: var(--panel); font-size: 15px; font-weight: 650; letter-spacing: 0.02em; display: inline-flex; align-items: center; gap: 6px; transition: background-color 0.15s, color 0.15s; }
.chip.on { background: var(--gold); color: #241a00; border-color: var(--gold); }
.chip.violet { border-color: rgba(185,147,255,0.6); color: #e2d4ff; }
.chip.violet.on { background: var(--violet); color: #1b0f33; }
.chip.blue { border-color: rgba(168,210,255,0.6); color: var(--blue); }
.chip.hint { border: 0; background: none; color: var(--dim); font-weight: 500; padding: 0 4px; letter-spacing: 0; }
.chip.out { background: rgba(243,214,140,0.08); border-color: rgba(243,214,140,0.45); color: var(--gold); padding-right: 2px; animation: rise 0.25s ease; }
.chip.out.old, .answerBtn.old { animation: none; }
#chips.compact .chip { padding: 0 10px; font-size: 14px; letter-spacing: 0.01em; }
.chip.out .who { color: var(--home); }
.chip.out .eta { color: rgba(243,214,140,0.75); font-weight: 500; }
.chip.out .x { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border-radius: 20px; color: var(--dim); font-size: 15px; }
.chip.out .x:active { background: rgba(255,255,255,0.08); }
.chip:active { filter: brightness(1.25); }
#primaryRow { display: flex; gap: 8px; }
.primary { position: relative; flex: 1; height: 54px; border-radius: 16px; background: var(--home); color: #1b1408; font-weight: 800; font-size: 17px; letter-spacing: 0.1em; box-shadow: 0 0 0 1px rgba(255,243,214,0.4), 0 6px 22px rgba(255,236,200,0.12); transition: background-color 0.25s ease, box-shadow 0.25s ease, transform 0.08s ease; }
.primary.tx { background: var(--gold); box-shadow: 0 0 0 1px rgba(243,214,140,0.6), 0 6px 26px rgba(243,214,140,0.25); }
.primary.pend { background: #dbe8ff; box-shadow: 0 0 0 1px rgba(219,232,255,0.5), 0 6px 22px rgba(168,210,255,0.08); }
.primary.listen { background: var(--green); box-shadow: 0 0 0 1px rgba(201,242,221,0.5), 0 6px 22px rgba(170,240,200,0.08); }
.primary.pulse { animation: pulse 1.3s ease-in-out infinite; }
.primary.sent::after { content: ''; position: absolute; inset: 0; border-radius: inherit; animation: sent 0.5s ease-out forwards; pointer-events: none; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(255,243,214,0.5), 0 0 28px rgba(255,236,200,0.4); } }
@keyframes sent { from { box-shadow: 0 0 0 0 rgba(255,243,214,0.75); } to { box-shadow: 0 0 0 14px rgba(255,243,214,0); } }
.primary:active { transform: scale(0.985); }
.primary:disabled { opacity: 0.55; }
.secondary { width: 64px; height: 54px; border-radius: 16px; background: var(--panel2); border: 1px solid var(--line); font-size: 14px; letter-spacing: -0.12em; color: var(--home); transition: background-color 0.2s, border-color 0.2s; }
.secondary.on { border-color: var(--gold); color: var(--gold); background: rgba(243,214,140,0.1); }
.secondary:disabled { opacity: 0.3; }
.answerBtn { height: 44px; border-radius: 14px; border: 1px solid rgba(168,210,255,0.6); color: var(--blue); background: rgba(168,210,255,0.08); font-weight: 700; letter-spacing: 0.06em; width: 100%; animation: rise 0.4s ease; }

/* bottom sheet */
#sheetBack { position: fixed; inset: 0; background: rgba(2,5,12,0.55); z-index: 10; animation: fade 0.2s ease; }
#sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-width: 560px; margin: 0 auto; max-height: 74%; display: flex; flex-direction: column; background: var(--panel); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 6px 16px calc(16px + var(--sab)); animation: up 0.28s cubic-bezier(.2,.8,.2,1); box-shadow: 0 -10px 40px rgba(0,0,0,0.5); }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
#sheetGrip { width: 40px; height: 4px; border-radius: 2px; background: rgba(160,185,230,0.25); margin: 4px auto 8px; flex: none; }
#sheetX { position: absolute; top: 8px; right: 8px; width: 44px; height: 44px; border-radius: 22px; color: var(--dim); font-size: 16px; z-index: 1; }
#sheetX:active { background: var(--panel2); }
#sheetBody { overflow-y: auto; -webkit-overflow-scrolling: touch; user-select: text; -webkit-user-select: text; padding-bottom: 2px; }
#sheetBody h2 { font-size: 19px; margin: 2px 48px 8px 0; font-weight: 700; color: var(--home); }
#sheetBody h2 .k { font-size: 11.5px; font-weight: 650; letter-spacing: 0.14em; color: var(--dim); display: block; margin-bottom: 3px; text-transform: uppercase; }
#sheetBody p { margin: 7px 0; color: var(--body); }
#sheetBody .age { color: var(--home); }
#sheetBody .rule { border-left: 2px solid var(--violet); padding-left: 10px; color: #e2d4ff; }
#sheetBody .tagline { color: var(--gold); }
#sheetBody hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0 12px; }
.menu { display: flex; flex-direction: column; gap: 6px; }
.menu .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.menu .grid button { flex-direction: column; align-items: flex-start; justify-content: center; gap: 1px; min-height: 54px; padding: 4px 14px; line-height: 1.25; }
.menu .grid button .v { font-size: 13px; }
.menu button { min-height: 48px; text-align: left; padding: 0 14px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); font-size: 15px; display: flex; align-items: center; justify-content: space-between; }
.menu button .v { color: var(--dim); font-size: 14px; }
.menu button .v.on { color: var(--teal); }
.btnrow { display: flex; gap: 8px; margin-top: 14px; }
.btnrow button { flex: 1; min-height: 50px; border-radius: 14px; font-weight: 700; background: var(--panel2); border: 1px solid var(--line); }
.btnrow button.go { background: var(--home); color: #1b1408; border-color: transparent; }
.loglist { font-size: 15px; }
.loglist div { padding: 8px 0; border-bottom: 1px solid rgba(160,185,230,0.07); color: var(--body); display: flex; gap: 10px; }
.loglist .y { flex: none; color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; min-width: 3.4em; padding-top: 2px; letter-spacing: 0.06em; }
.codex div { padding: 10px 0; border-bottom: 1px solid rgba(160,185,230,0.07); color: var(--body); }
.codex b { display: block; color: var(--home); font-size: 15px; margin-bottom: 2px; }
.codex .locked { color: var(--dim); letter-spacing: 0.1em; }
.lv { display: flex; flex-direction: column; gap: 6px; }
.lv button { min-height: 50px; text-align: left; padding: 0 14px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.lv button.cur { border-color: rgba(255,243,214,0.45); }
.lv .act { font-size: 11px; letter-spacing: 0.16em; color: var(--dim); margin: 10px 0 0 4px; text-transform: uppercase; }
.lv .act:first-child { margin-top: 0; }
.lv .num { color: var(--dim); width: 1.4em; font-variant-numeric: tabular-nums; }
.lv .done { margin-left: auto; color: var(--teal); }
.hints p { padding: 10px 12px; background: var(--panel2); border-radius: 10px; }
.hints p:last-child { animation: fadein 0.3s ease; }

/* overlay cards */
#overlay { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: calc(24px + var(--sat)) 24px calc(24px + var(--sab)); text-align: center; animation: fade 0.45s ease; }
#overlay.tapcard { cursor: pointer; }
.card { position: relative; max-width: 420px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.card .line { font-size: 21px; line-height: 1.38; color: var(--home); animation: fadein 0.8s ease both; font-weight: 400; text-wrap: balance; }
.card .prev, .card.still .ttl2, .card.still .kicker { animation: none; }
.card .sub { font-size: 17px; line-height: 1.45; color: var(--body); animation: fadein 0.8s ease both; text-wrap: balance; }
.card .kicker { font-size: 12px; letter-spacing: 0.24em; color: var(--dim); text-transform: uppercase; margin-right: -0.24em; }
.card .title { font-size: clamp(28px, 9.6vw, 42px); letter-spacing: 0.26em; margin-right: -0.26em; white-space: nowrap; font-weight: 300; color: var(--home); text-shadow: 0 0 30px rgba(255,236,200,0.35); }
.card .ttl2 { font-size: 27px; font-weight: 650; color: var(--home); line-height: 1.2; text-wrap: balance; animation: fadein 0.6s ease both; }
.card .rule { width: 36px; height: 1px; background: rgba(255,243,214,0.35); }
.card.inter .itext { min-height: 150px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.tapmore { position: absolute; bottom: calc(22px + var(--sab)); left: 0; right: 0; font-size: 11px; letter-spacing: 0.24em; color: var(--dim); text-transform: uppercase; animation: breathe 2.6s ease-in-out infinite; pointer-events: none; }
@keyframes breathe { 50% { opacity: 0.35; } }
.halo { position: absolute; left: 50%; top: 50%; width: 260px; height: 260px; margin: -130px 0 0 -130px; border-radius: 50%; border: 1px solid rgba(255,243,214,0.35); opacity: 0; pointer-events: none; animation: ripple 5s cubic-bezier(.1,.6,.3,1) infinite; }
.halo.b { animation-delay: 2.5s; }
@keyframes ripple { 0% { transform: scale(0.1); opacity: 0.8; } 100% { transform: scale(1.9); opacity: 0; } }
.titlewrap { position: relative; padding: 30px 0 4px; }
.bigbtn { min-height: 54px; min-width: 200px; padding: 0 28px; border-radius: 16px; background: var(--home); color: #1b1408; font-weight: 800; letter-spacing: 0.1em; font-size: 16px; box-shadow: 0 6px 26px rgba(255,236,200,0.15); }
.bigbtn:active { transform: scale(0.985); }
.ghostbtn { min-height: 48px; min-width: 200px; padding: 0 18px; border-radius: 14px; border: 1px solid var(--line); color: var(--text); }
.ghostbtn.quiet { min-height: 44px; min-width: 0; margin-top: 10px; padding: 0 16px; font-size: 14px; color: var(--dim); }
.caption { font-size: 14px; color: var(--dim); font-style: italic; line-height: 1.45; }
.found { font-size: 12px; letter-spacing: 0.16em; color: var(--teal); text-transform: uppercase; }

/* win + truth replay */
.win { max-width: 440px; width: 100%; display: flex; flex-direction: column; gap: 8px; align-items: stretch; max-height: 100%; overflow-y: auto; scrollbar-width: none; }
.win > * { flex: none; }
.win .kicker { font-size: 11.5px; letter-spacing: 0.22em; color: var(--dim); text-transform: uppercase; }
.win .conf { font-size: 26px; font-weight: 650; color: var(--home); letter-spacing: 0.02em; line-height: 1.15; animation: fadein 0.5s ease both; }
.win .conf::before { content: ''; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--home); box-shadow: 0 0 12px rgba(255,243,214,0.8); margin-right: 10px; vertical-align: 0.18em; }
.win .conf.plain { font-size: 22px; }
.win .conf.plain::before { display: none; }
.win .when { font-size: 17px; color: var(--body); line-height: 1.4; animation: fadein 0.5s ease 0.15s both; }
.win .when b { color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; }
/* L0's win screen carries the delay ledger too, so it packs a little tighter */
.win.l0 { gap: 6px; }
.win.l0 .end { font-size: 14px; }
.win .ledger { display: grid; grid-template-columns: auto auto auto; justify-content: center; gap: 0 8px; font-size: 13.5px; line-height: 1.3; text-align: left; white-space: nowrap; animation: fadein 0.5s ease 0.2s both; }
.win .ledger > div { display: contents; }
.win .ledger .lk { color: var(--home); }
.win .ledger b { color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.win .ledger .ln { color: var(--dim); }
.win .end { font-size: 15px; color: var(--dim); font-style: italic; line-height: 1.4; text-wrap: balance; animation: fadein 0.5s ease 0.3s both; }
.replay { width: 100%; display: flex; flex-direction: column; gap: 6px; align-items: center; margin-top: 4px; animation: fade 0.6s ease 0.35s both; }
.rbox { position: relative; }
.rbox canvas { display: block; border-radius: 14px; background: #050a17; border: 1px solid var(--line); }
.rtag { position: absolute; left: 10px; top: 8px; right: 10px; display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 0.14em; color: var(--dim); text-transform: uppercase; pointer-events: none; font-variant-numeric: tabular-nums; }
.rtag .rmode { color: var(--home); opacity: 0.8; }
.rctl { display: flex; align-items: center; gap: 8px; width: 100%; }
.seg { flex: 1; display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { flex: 1; min-height: 44px; padding: 0 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: var(--dim); transition: background-color 0.2s, color 0.2s; }
.seg button.on { background: var(--panel2); color: var(--home); }
.rbtn { width: 44px; height: 44px; flex: none; border-radius: 12px; border: 1px solid var(--line); color: var(--home); font-size: 18px; }
.scrub { width: 100%; }
.scrub input { width: 100%; height: 36px; margin: 0; background: none; -webkit-appearance: none; appearance: none; cursor: pointer; }
.scrub input::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: rgba(160,185,230,0.25); }
.scrub input::-moz-range-track { height: 3px; border-radius: 2px; background: rgba(160,185,230,0.25); }
.scrub input::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -8.5px; border-radius: 50%; background: var(--home); box-shadow: 0 0 10px rgba(255,243,214,0.5); }
.scrub input::-moz-range-thumb { width: 20px; height: 20px; border: 0; border-radius: 50%; background: var(--home); }
.rlabel { font-size: 13px; color: var(--dim); min-height: 1.3em; }

/* endings */
.stampwrap { position: relative; padding: 22px 22px 20px; border: 1px solid var(--line); border-radius: 6px; background: #0b1224; width: 100%; max-width: 360px; text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
.stampwrap .doc { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13.5px; color: #b9c4d9; line-height: 1.65; }
.stampwrap .doc.letter { font-family: inherit; font-size: 16px; line-height: 1.55; color: var(--body); }
.stampwrap .doc.letter .sig { display: block; margin-top: 12px; color: var(--home); }

<script>
"use strict";
const LEVELS_JSON = [{"n":1,"act":1,"name":"As It Was","R":4,"drones":{"A":[-1,1]},"derelicts":[{"id":"D1","pos":[2,-3],"dir":"SE","period":3,"first":2},{"id":"D2","pos":[-4,5],"dir":"NE","period":3,"first":8}],"objective":{"type":"tag_any","text":"Tag a derelict."},"test_plans":{"naive: aim at what you see":[[0,"MOVE","A",[2,-4]]],"naive, then corrected at y2":[[0,"MOVE","A",[2,-4]],[2,"MOVE","A",[2,-1]]],"reference: wait for projection":[[2,"MOVE","A",[2,0]]],"second chance only (D2)":[[0,"MOVE","A",[2,-4]],[12,"MOVE","A",[2,-1]]]}},{"n":2,"act":1,"name":"Closer Than It Looks","R":4,"drones":{"A":[-1,0],"B":[-2,4]},"derelicts":[{"id":"D1","pos":[1,-4],"dir":"SE","period":3,"first":3},{"id":"D2","pos":[1,0],"dir":"SW","period":3,"first":3}],"watchers":[{"id":"m0","pos":[-3,-1],"kind":"mirror","hidden":true}],"objective":{"type":"tag","ids":["D1","D2"],"text":"Tag both derelicts."},"test_plans":{"naive: aim at what you see (y5)":[[5,"MOVE","A",[1,-3]],[5,"MOVE","B",[-1,2]]],"reference":[[6,"MOVE","B",[-3,4]],[7,"MOVE","A",[1,0]]]}},{"n":3,"act":1,"name":"Chorus","R":4,"drones":{"A":[-1,0],"B":[2,2]},"receivers":[{"id":"X","cell":[3,-1],"need":2}],"watchers":[{"id":"m1","pos":[-2,-1],"kind":"mirror","hidden":true}],"objective":{"type":"rec","id":"X","text":"Wake the old relay: two signals must reach it in the same year."},"test_plans":{"naive: flash both now":[[0,"FLASH","A",null],[0,"FLASH","B",null]],"reference":[[0,"FLASH","B",null],[2,"FLASH","A",null]]}},{"n":4,"act":1,"name":"Filed Noise","R":4,"drones":{"A":[0,-2],"B":[-2,3],"C":[3,1]},"derelicts":[{"id":"D","pos":[-3,-1],"dir":"E","period":3,"first":2}],"receivers":[{"id":"X","ride":"D","need":3}],"watchers":[{"id":"m2","pos":[-3,0],"kind":"mirror","hidden":true},{"id":"m3","pos":[2,2],"kind":"mirror","hidden":true}],"objective":{"type":"rec","id":"X","text":"A relay rides this derelict. Three signals, one year."},"test_plans":{"naive: flash all at y5":[[5,"FLASH","A",null],[5,"FLASH","B",null],[5,"FLASH","C",null]],"reference (sends after projection)":[[5,"FLASH","C",null],[6,"FLASH","B",null],[9,"FLASH","A",null]]}},{"n":5,"act":2,"name":"Standing","R":4,"drones":{},"watchers":[{"id":"P","pos":[3,-3],"kind":"precedent"},{"id":"S","pos":[-3,1],"kind":"sign"}],"objective":{"type":"sign","text":"Ask both watchers. Collect both signatures."},"test_plans":{"naive: ask both at once":[[0,"PING","HOME","P"],[0,"PING","HOME","S"]],"wrong order":[[0,"PING","HOME","S"],[1,"PING","HOME","P"]],"reference":[[0,"PING","HOME","P"],[1,"PING","HOME","S"]]}},{"n":6,"act":2,"name":"No Universal Now","R":4,"drones":{"X":[4,-4],"Y":[0,-1]},"watchers":[{"id":"P","pos":[3,-3],"kind":"precedent"},{"id":"Q","pos":[0,-3],"kind":"precedent"}],"objective":{"type":"sign","text":"Each insists on being asked first. Satisfy both."},"test_plans":{"naive: both drones now":[[0,"FLASH","X","P"],[0,"FLASH","Y","Q"]],"Home asks both, P first":[[0,"PING","HOME","P"],[1,"PING","HOME","Q"]],"Home asks both, Q first":[[0,"PING","HOME","Q"],[1,"PING","HOME","P"]],"one drone does both":[[0,"FLASH","X","P"],[0,"MOVE","X",[1,-3]],[9,"FLASH","X","Q"]],"reference":[[0,"FLASH","X","P"],[2,"FLASH","Y","Q"]],"alt: drone + Home":[[0,"FLASH","X","P"],[3,"PING","HOME","Q"]]}},{"n":7,"act":2,"name":"The Knot","R":4,"drones":{"X":[2,-4],"Y":[0,-1],"Z":[4,-1]},"watchers":[{"id":"P","pos":[2,-3],"kind":"precedent"},{"id":"Q","pos":[0,-2],"kind":"precedent"},{"id":"R","pos":[3,-1],"kind":"precedent","split":{"tick":6,"id":"R2","pos":[3,0],"kind":"sign"}}],"objective":{"type":"sign","text":"Three precedents. Every party must sign."},"test_plans":{"naive: all three now":[[0,"FLASH","X","P"],[0,"FLASH","Y","Q"],[0,"FLASH","Z","R"]],"solve P,Q,R but miss the split":[[0,"FLASH","X","P"],[3,"FLASH","Y","Q"],[0,"FLASH","Z","R"]],"reference":[[0,"FLASH","X","P"],[3,"FLASH","Y","Q"],[0,"FLASH","Z","R"],[9,"PING","HOME","R2"]]}},{"n":0,"act":0,"name":"First Light","R":3,"drones":{"A":[1,-2]},"objective":{"type":"reach","drone":"A","cell":[3,-2],"text":"Send A to the mark. Then find out."},"test_plans":{"no order":[],"reference: send A at y0":[[0,"MOVE","A",[3,-2]]],"late order (y3)":[[3,"MOVE","A",[3,-2]]],"wrong hex, then the mark (y1)":[[0,"MOVE","A",[2,-3]],[1,"MOVE","A",[3,-2]]]}}];
// LIGHT LAG — rules simulator. Faithful port of reference/sim.py, plus two
// finale-only extensions (STANDING orders and the independent drone's own
// answer). Pure functions; no DOM. Shared by the game and the node tests.
const SIM = (() => {
  const DIRS = { E: [1, 0], NE: [1, -1], NW: [0, -1], W: [-1, 0], SW: [-1, 1], SE: [0, 1] };
  const HOME = [0, 0];
  const DRONE_STEP = 2;

  const eq = (a, b) => !!a && !!b && a[0] === b[0] && a[1] === b[1];
  function dist(a, b) {
    const dq = a[0] - b[0], dr = a[1] - b[1];
    return Math.max(Math.abs(dq), Math.abs(dr), Math.abs(dq + dr));
  }
  const ring = (p) => dist(p, HOME);
  // Python's round(): half to even
  function pyRound(x) {
    const f = Math.floor(x), d = x - f;
    if (d > 0.5) return f + 1;
    if (d < 0.5) return f;
    return f % 2 === 0 ? f : f + 1;
  }
  function cubeRound(x, y, z) {
    let rx = pyRound(x), ry = pyRound(y), rz = pyRound(z);
    const dx = Math.abs(rx - x), dy = Math.abs(ry - y), dz = Math.abs(rz - z);
    if (dx > dy && dx > dz) rx = -ry - rz;
    else if (dy > dz) ry = -rx - rz;
    else rz = -rx - ry;
    return [rx + 0, rz + 0];
  }
  function stepToward(a, b) {
    const n = dist(a, b);
    if (n === 0) return a;
    const ax = a[0] + 1e-6, az = a[1] + 2e-6, ay = -ax - az;
    const bx = b[0] + 1e-6, bz = b[1] + 2e-6, by = -bx - bz;
    const t = 1.0 / n;
    return cubeRound(ax + (bx - ax) * t, ay + (by - ay) * t, az + (bz - az) * t);
  }
  function path(a, b) {
    const out = [a];
    while (!eq(out[out.length - 1], b)) out.push(stepToward(out[out.length - 1], b));
    return out;
  }

  // plan: array of {t, kind, who, arg} or [t, kind, who, arg]
  //   MOVE who=drone arg=[q,r] · FLASH who=drone arg=null|watcherId
  //   PING who='HOME' arg=watcherId · STANDING who=drone (finale)
  function simulate(level, planIn, T = 80) {
    const R = level.R;
    const plan = (planIn || []).map((x) => Array.isArray(x) ? { t: x[0], kind: x[1], who: x[2], arg: x[3] } : x);
    const drones = Object.entries(level.drones || {}).map(([k, v]) => ({ id: k, pos: [v[0], v[1]], target: null, next: null, indep: null, arrivedAt: null }));
    const D = Object.fromEntries(drones.map((d) => [d.id, d]));
    const ders = (level.derelicts || []).map((d) => ({ id: d.id, pos: [d.pos[0], d.pos[1]], dir: DIRS[d.dir], p: d.period, next: d.first, gone: false, tagged: null, entered: ring(d.pos) <= R }));
    const recs = (level.receivers || []).map((r) => Object.assign({}, r, { active: null }));
    const wat = (level.watchers || []).map((w) => ({ id: w.id, pos: [w.pos[0], w.pos[1]], kind: w.kind, signed: null, offended: null, born: 0, split: w.split || null, hidden: !!w.hidden }));
    const W = Object.fromEntries(wat.map((w) => [w.id, w]));
    const pulses = [], events = [], arrivals = [], received = new Set(), hist = {};
    const planned = {};
    for (const o of plan) (planned[o.t] = planned[o.t] || []).push(o);

    const derById = Object.fromEntries(ders.map((d) => [d.id, d]));
    const recPos = (r) => {
      if (r.cell) return r.cell;
      const d = derById[r.ride];
      return d.gone ? null : d.pos;
    };
    const H = (key) => (hist[key] = hist[key] || {});
    function record(t) {
      for (const d of drones) H('drone:' + d.id)[t] = d.pos;
      for (const d of ders) if (!d.gone && ring(d.pos) <= R) H('der:' + d.id)[t] = d.pos;
      for (const w of wat) if (w.born <= t) H('wat:' + w.id)[t] = w.pos;
    }
    function emitHome(t) {
      for (const o of planned[t] || []) {
        if (o.kind === 'MOVE' || o.kind === 'FLASH' || o.kind === 'STANDING') {
          pulses.push({ src: HOME, t, kind: 'order', to: o.who, payload: [o.kind, o.arg], sent: t, from: 'HOME' });
        } else if (o.kind === 'PING') {
          pulses.push({ src: HOME, t, kind: 'signal', to: o.arg, payload: 'HOME', sent: t, from: 'HOME' });
          events.push({ t, pos: HOME, type: 'flash', data: ['HOME', o.arg], sent: t });
        }
      }
    }
    function arrivalsAt(t) {
      const sigAtRec = {}, watIn = {};
      let changed = true;
      while (changed) {
        changed = false;
        const targets = [];
        for (const d of drones) targets.push(['drone', d.id, d.pos]);
        for (const w of wat) if (w.born <= t) targets.push(['wat', w.id, w.pos]);
        for (const r of recs) { const p = recPos(r); if (p) targets.push(['rec', r.id, p]); }
        const snap = pulses.slice();
        for (let i = 0; i < snap.length; i++) {
          const p = snap[i];
          if (p.t > t) continue;
          for (const [typ, k, pos] of targets) {
            const key = i + '|' + typ + '|' + k;
            if (received.has(key)) continue;
            if (t - p.t >= dist(p.src, pos)) {
              received.add(key);
              if (typ === 'wat' && p.t + dist(p.src, pos) < W[k].born) continue;
              changed = true;
              arrivals.push({ i, typ, k, t });
              if (typ === 'drone' && p.kind === 'order' && p.to === k) {
                const [kind, arg] = p.payload; const d = D[k];
                if (d.indep !== null) { events.push({ t, pos: d.pos, type: 'declined', data: [k, kind], sent: p.sent }); continue; }
                events.push({ t, pos: d.pos, type: 'order_rx', data: [k, kind], sent: p.sent });
                if (kind === 'FLASH') {
                  pulses.push({ src: d.pos, t, kind: 'signal', to: arg, payload: k, sent: p.sent, from: k });
                  events.push({ t, pos: d.pos, type: 'flash', data: [k, arg], sent: p.sent });
                } else if (kind === 'STANDING') {
                  d.indep = t; d.target = level.standing.target; d.next = t + DRONE_STEP;
                  events.push({ t, pos: d.pos, type: 'standing', data: [k], sent: p.sent });
                  if (eq(d.pos, d.target)) { d.target = null; d.arrivedAt = t; }
                } else {
                  d.target = arg; d.next = t + DRONE_STEP;
                }
              } else if (typ === 'rec' && p.kind === 'signal' && p.to === null) {
                (sigAtRec[k] = sigAtRec[k] || []).push(i);
              } else if (typ === 'wat') {
                (watIn[k] = watIn[k] || []).push(p);
              }
            }
          }
        }
      }
      for (const r of recs) {
        const lst = sigAtRec[r.id];
        if (lst && r.active === null && lst.length >= r.need) { r.active = t; events.push({ t, pos: recPos(r), type: 'rec_on', data: r.id }); }
      }
      for (const w of wat) {
        const plist = watIn[w.id];
        if (!plist) continue;
        events.push({ t, pos: w.pos, type: 'glint', data: w.id });
        if ((w.kind !== 'sign' && w.kind !== 'precedent') || w.signed !== null || w.offended !== null) continue;
        const mine = plist.filter((p) => p.kind === 'signal' && p.to === w.id);
        const others = plist.filter((p) => p.kind === 'signal' && p.to !== null && p.to !== w.id);
        if (w.kind === 'precedent' && others.length) {
          w.offended = t;
          events.push({ t, pos: w.pos, type: 'offended', data: w.id, cause: others.map((p) => p.sent), tie: mine.length > 0 });
        } else if (mine.length) {
          w.signed = t; events.push({ t, pos: w.pos, type: 'sign', data: w.id });
        }
      }
    }

    // Prehistory
    for (let tau = -3 * R; tau < 0; tau++) {
      for (const d of drones) H('drone:' + d.id)[tau] = d.pos;
      for (const w of wat) H('wat:' + w.id)[tau] = w.pos;
      for (const d of ders) {
        let steps = 0;
        for (let s = d.next - d.p; s > tau; s -= d.p) if (s <= 0) steps++;
        const pos = [d.pos[0] - d.dir[0] * steps, d.pos[1] - d.dir[1] * steps];
        if (ring(pos) <= R) H('der:' + d.id)[tau] = pos;
      }
    }
    record(0); emitHome(0); arrivalsAt(0);
    for (let t = 1; t <= T; t++) {
      const prev = Object.fromEntries(drones.map((d) => [d.id, d.pos]));
      const prevd = Object.fromEntries(ders.map((d) => [d.id, d.pos]));
      for (const d of ders) {
        if (!d.gone && d.next === t) {
          d.pos = [d.pos[0] + d.dir[0], d.pos[1] + d.dir[1]]; d.next += d.p;
          if (ring(d.pos) <= R) d.entered = true;
          else if (d.entered) { d.gone = true; events.push({ t, pos: prevd[d.id], type: 'exit', data: d.id }); }
        }
      }
      for (const d of drones) {
        if (d.target !== null && d.next === t) {
          d.pos = stepToward(d.pos, d.target); d.next += DRONE_STEP;
          if (eq(d.pos, d.target)) { d.target = null; if (d.indep !== null) d.arrivedAt = t; }
        }
      }
      for (const w of wat.slice()) {
        const s = w.split;
        if (s && s.tick === t) {
          const c = { id: s.id, pos: s.pos, kind: s.kind, signed: null, offended: null, born: t, split: null, hidden: false, parent: w.id };
          wat.push(c); W[c.id] = c;
          events.push({ t, pos: s.pos, type: 'split', data: [w.id, s.id] });
        }
      }
      // finale: an independent drone answers after listening
      for (const d of drones) {
        if (d.indep !== null && d.arrivedAt !== null && level.standing && t === d.arrivedAt + level.standing.listen) {
          pulses.push({ src: d.pos, t, kind: 'signal', to: level.standing.to, payload: d.id, sent: null, from: d.id, standing: true });
          events.push({ t, pos: d.pos, type: 'flash', data: [d.id, level.standing.to], standing: true });
        }
      }
      emitHome(t); arrivalsAt(t);
      for (const d of ders) {
        if (d.gone || d.tagged !== null) continue;
        for (const dr of drones) {
          if (eq(dr.pos, d.pos) || (eq(dr.pos, prevd[d.id]) && eq(prev[dr.id], d.pos))) {
            d.tagged = t; events.push({ t, pos: d.pos, type: 'tag', data: [d.id, dr.id] }); break;
          }
        }
      }
      record(t);
    }
    return { events, arrivals, pulses, hist, drones, ders, recs, wat };
  }

  const seenTick = (ev) => ev.t + ring(ev.pos);

  const sortedTicks = (h) => h.__ticks || Object.defineProperty(h, '__ticks', { value: Object.keys(h).map(Number).sort((a, b) => a - b) }).__ticks;
  function seenPos(h, now) {
    if (!h) return null;
    let best = null;
    for (const tau of sortedTicks(h)) if (tau + ring(h[tau]) <= now) best = tau;
    return best === null ? null : [best, h[best]];
  }

  function outcome(level, plan, T = 80, res) {
    res = res || simulate(level, plan, T);
    const ev = res.events, obj = level.objective, req = [];
    if (obj.type === 'tag_any') {
      const e = ev.filter((x) => x.type === 'tag');
      if (!e.length) return null;
      req.push(e.reduce((a, b) => (seenTick(b) < seenTick(a) ? b : a)));
    } else if (obj.type === 'tag') {
      for (const id of obj.ids) {
        const e = ev.find((x) => x.type === 'tag' && x.data[0] === id);
        if (!e) return null; req.push(e);
      }
    } else if (obj.type === 'rec') {
      const e = ev.find((x) => x.type === 'rec_on' && x.data === obj.id);
      if (!e) return null; req.push(e);
    } else if (obj.type === 'reach') {
      // L0: the first year (>= 0) the named drone stands on the cell
      const h = res.hist['drone:' + obj.drone] || {};
      let t = null;
      for (let y = 0; y <= T; y++) if (h[y] && eq(h[y], obj.cell)) { t = y; break; }
      if (t === null) return null;
      req.push({ t, pos: obj.cell, type: 'reach', data: obj.drone });
    } else if (obj.type === 'sign') {
      for (const w of res.wat) {
        if (w.kind === 'sign' || w.kind === 'precedent') {
          const e = ev.find((x) => x.type === 'sign' && x.data === w.id);
          if (!e) return null; req.push(e);
        }
      }
    } else return null;
    const last = req.reduce((a, b) => (seenTick(b) > seenTick(a) ? b : a));
    return { confirmed_at_home: seenTick(last), happened_at: last.t, lag: seenTick(last) - last.t, req };
  }

  function firstSeenMove(level, derId, horizon = 60) {
    const res = simulate(level, [], horizon);
    const h = res.hist['der:' + derId] || {};
    let first = null;
    for (let n = 0; n < horizon; n++) {
      const s = seenPos(h, n);
      if (!s) continue;
      if (first === null) first = s[1];
      else if (!eq(s[1], first)) return n;
    }
    return null;
  }

  return { DIRS, HOME, DRONE_STEP, eq, dist, ring, stepToward, path, simulate, seenTick, seenPos, outcome, firstSeenMove };
})();
if (typeof module !== 'undefined') module.exports = SIM;

// LIGHT LAG — finale (Act III) timeline. Pure: derived from the sim result of
// the finale level + the committed plan. W reacts only to what reaches it.
const FIN = (() => {
  const S = (typeof SIM !== 'undefined') ? SIM : require('./sim.js');
  const W = [5, -3], WR = 5;
  const CALLS = [5, 7, 9, 11, 13, 15, 17, 19];
  const NOTYET = [8, 11, 14, 17, 20, 23, 26];

    G.queue = G.queue.filter((o) => !(o.kind === 'PING' && o.arg === target));
    G.queue.push({ kind: 'PING', who: 'HOME', arg: target });
  } else {
    G.queue = G.queue.filter((o) => !(o.kind === 'FLASH' && o.who === id));
    G.queue.push({ kind: 'FLASH', who: id, arg: target });
  }
  AU.step();
  if (id === 'HOME') { G.sel = null; G.mode = 'move'; } else G.mode = 'move';
  updateUI();
}
function onBoardTap(x, y) {
  AU.init(); stopFF();
  if (!geom || G.locked) return;
  if (G.beat) { beatTap(); return; } // the beat is watch-only: a tap moves it along
  const hex = geom.hexAt(x, y);
  if (G.n === 8 && G.finIntro < 3) { finIntroNext(); return; }
  if (G.won) return;
  if (G.guide >= 0) { guideTap(hex); return; }
  if (G.tut >= 0 && G.tut < 4) { tutTap(hex); return; }
  if (!hex) { deselect(); return; }
  const droneId = droneAtHex(hex);
  if (G.sel && G.sel !== 'HOME' && G.mode === 'move') {
    if (droneId === G.sel) { deselect(); return; }
    if (droneId) { select(droneId); return; }
    if (G.n === 8 && G.fin.standingAt !== null && G.now >= G.fin.standingAt) { toast('V has standing. It no longer takes your orders.'); return; }
    queueMove(G.sel, hex); return;
  }
  if (G.sel && G.mode === 'ask') {
    const w = watcherAtHex(hex);
    if (w) { queueFlash(G.sel, w.id); return; }
    if (droneId) { select(droneId); return; }
    toast('Ask cancelled.');
    if (G.sel === 'HOME') deselect(); else { G.mode = 'move'; updateUI(); }
    return;
  }
  if (droneId) { select(droneId); return; }
  if (SIM.eq(hex, SIM.HOME) && actOf(G.n) === 2) { select('HOME'); return; }
  if (G.sel) { deselect(); return; }
  inspect(hex);
}
canvas.addEventListener('click', (ev) => {
  const r = canvas.getBoundingClientRect();

});

// ---------- arrival tags ----------
function unlockedNow(id) { const u = G.unlock[id]; return u !== null && u !== undefined && G.now >= u; }
function knownTargets() {
  const out = [];

    if (r.cell) out.push({ id: r.id, kind: 'fix', pos: r.cell, color: COL.relay });
    else if (SIM.seenPos(G.res.hist['der:' + r.ride], G.now)) out.push({ id: r.id, kind: 'ride', ride: r.ride, color: COL.relay });
  }
  for (const w of knownWatchers()) {
    // once Home has seen a watcher sign or object, other people's requests can't change it
    const settled = G.res.events.some((e) => (e.type === 'sign' || e.type === 'offended') && e.data === w.id && SIM.seenTick(e) <= G.now);
    out.push({ id: w.id, kind: 'fix', pos: w.pos, born: w.born, color: '#dccbff', settled });
  }
  if (G.L.world) out.push({ id: 'W', kind: 'fix', pos: FIN.W, color: COL.world });
  return out;
}
function rideArrival(res, derId, t0, src) {
  const h = res.hist['der:' + derId];
  for (let t = t0; t <= 80; t++) { const p = h[t]; if (!p) return null; if (t - t0 >= SIM.dist(src, p)) return t; }
  return null;
}
function computeTags() {
  const tags = [], lines = [], info = [];
  const q = G.queue.map((o) => Object.assign({ t: G.now, queued: true }, o));
  const all = G.plan.concat(q);
  const res = q.length ? SIM.simulate(G.L, all, 80) : G.res;
  const known = knownTargets();
  for (const o of all) {
    let txt = '';
    if (o.kind === 'MOVE') {
      const rx = res.events.find((e) => e.type === 'order_rx' && e.sent === o.t && e.data[0] === o.who && e.data[1] === 'MOVE');
      if (!rx) { if (o.queued) txt = ''; continue; }
      const later = res.events.filter((e) => e.type === 'order_rx' && e.data[0] === o.who && (e.data[1] === 'MOVE' || e.data[1] === 'STANDING') && e.sent > o.t).map((e) => e.t);
      const cutoff = later.length ? Math.min(...later) : 999;
      const h = res.hist['drone:' + o.who];
      let arr = null;
      for (let t = rx.t; t <= 80 && t < cutoff; t++) if (SIM.eq(h[t], o.arg)) { arr = t; break; }
      if (arr === null) continue;
      if (!o.queued && arr <= G.now) continue;
      tags.push({ pos: o.arg, text: `arrives yr ${arr}`, color: COL.drone, queued: !!o.queued });
      lines.push({ who: o.who, target: o.arg, queued: !!o.queued });
      txt = `arrives yr ${arr}`;
    } else if (o.kind === 'FLASH' || o.kind === 'PING') {
      let t0, src;
      if (o.kind === 'PING') { t0 = o.t; src = SIM.HOME; }
      else { const fe = res.events.find((e) => e.type === 'flash' && e.sent === o.t && e.data[0] === o.who); if (!fe) continue; t0 = fe.t; src = fe.pos; }
      for (const k of known) {
        let at, pos;
        if (k.kind === 'ride') {
          const tp = res.hist['der:' + k.ride][G.now];
          pos = unlockedNow(k.ride) && tp ? tp : (SIM.seenPos(res.hist['der:' + k.ride], G.now) || [0, null])[1];
          if (!pos) continue;
          at = unlockedNow(k.ride) ? rideArrival(res, k.ride, t0, src) : '?';
          if (at === null) continue;
        } else {
          pos = k.pos; at = t0 + SIM.dist(src, k.pos);
          if (k.born && at < k.born) continue;
        }
        if (!o.queued && at !== '?' && at < G.now) continue;
        const addressed = o.arg && k.id === o.arg;
        if (G.L.world && k.id === 'W' && !addressed) continue;
        if (k.settled && !addressed) continue;
        tags.push({ pos, text: `${addressed ? '\u2192 ' : ''}reaches yr ${at}`, color: k.color, queued: !!o.queued });
        if (addressed || (!o.arg && k.kind !== 'fix') || (!o.arg && G.L.receivers && G.L.receivers.some((r) => r.id === k.id))) txt = `reaches ${nm(k.id)} yr ${at}`;
      }
    } else if (o.kind === 'STANDING') {
      const rx = res.events.find((e) => e.type === 'standing' && e.sent === o.t);
      if (rx) txt = `reaches V yr ${rx.t}`;
    }
    if (o.queued) info.push(txt);

}

// log
let logTimer = null, logShown = 0;
function addLog(text, action) {
  G.logs.push({ y: G.now, text, action: action || null });
  scheduleLogLine();
}
function scheduleLogLine() {
  if (logTimer) return;
  const step = () => {
    logTimer = null;
    if (logShown < G.logs.length - 1) { logShown++; renderLogLine(true); logTimer = setTimeout(step, 1500); }
    else if (logShown === G.logs.length - 1) renderLogLine(true);
  };
  if (logShown > G.logs.length - 1) logShown = G.logs.length - 1;
  if (logShown < G.logs.length - 2) logShown = G.logs.length - 2; // don't lag too far behind
  step();
}
let shownAct = null;
function renderLogLine(fresh) {
  const l = G.logs[Math.min(logShown, G.logs.length - 1)];
  const lt = $('logtext'), la = $('logact');
  lt.textContent = l ? l.text : '';
  if (fresh) for (const el of [lt, $('log')]) { el.classList.remove('fresh'); void el.offsetWidth; el.classList.add('fresh'); }
  // the newest open action (smart rewind) stays reachable
  const act = [...G.logs].reverse().find((x) => x.action && !x.used && x.y <= G.now);
  const want = act && !G.won ? act : null;
  if (want === shownAct && (!want || la.childElementCount)) return;
  shownAct = want; la.innerHTML = '';
  if (want) {
    const b = document.createElement('button'); b.textContent = want.action.label + ' \u21BA';
    b.onclick = (ev) => { ev.stopPropagation(); want.used = true; want.action.fn(); };
    la.appendChild(b);
  }
}

function inspect(hex) {

    const atImg = sp && SIM.eq(sp[1], hex), atNow = tp && SIM.eq(tp, hex);
    if (!atImg && !atNow) continue;
    const ride = (L.receivers || []).find((r) => r.ride === d.id);

    parts.push(`<h2><span class="k">Derelict probe</span>${esc(d.id)}${atNow && !atImg ? ' \u00b7 calculated position' : ''}</h2>
      <p>Ancient and unpowered. It drifts one light-year every ${d.period} years and will not change course for anyone.</p>
      ${atImg ? seenAgo('der:' + d.id) : '<p class="age">Dashed: where Home calculates it is now.</p>'}
      <p>${unlockedNow(d.id) ? 'Projection: on. Home has seen it move, so the dashed marker and dotted track show where it is and where it will be.' : 'Projection: off. Home has not yet seen it move, so it cannot say where it is now.'}</p>
      ${ride ? `<p class="rule">Carries an old relay. It wakes if ${ride.need} open signals reach it in the same year.</p>` : ''}

  }

    parts.push(`<h2><span class="k">Relay</span>${esc(r.id)}</h2><p class="rule">Wakes if ${r.need} open signals reach it in the same year. Signals in different years do not add up.</p>
      <p class="age">Ring ${SIM.ring(hex)}: what you see of it is ${SIM.ring(hex)} years old.</p>${on ? `<p>Woke in year ${on.t}. Seen in year ${SIM.seenTick(on)}.</p>` : ''}${tagsAt(hex)}`);

      <p class="rule">${esc(rule)}</p>${w.parent ? `<p class="rule">Requests addressed to ${esc(nm(w.parent))} do not count for ${esc(nm(w.id))}.</p>` : ''}
      ${seenAgo('wat:' + w.id)}${st ? `<p>${st.type === 'sign' ? 'Signed' : 'Objected'} in year ${st.t}. Seen in year ${SIM.seenTick(st)}.</p>` : ''}${tagsAt(hex)}`);
  }
  if (L.world && SIM.eq(hex, FIN.W)) {
    parts.push(`<h2><span class="k">Ring 5</span>A pale blue world</h2><p>Everything you know about it is five years old. Anything you say reaches it five years from now.</p>${G.now >= 10 ? '<p class="rule">It is asking. Some of it is saying not yet.</p>' : ''}${tagsAt(hex)}`);
  }

  if (!parts.length) { const r = SIM.ring(hex); toast(r === 0 ? 'Home.' : `Ring ${r}. Light from here is ${r} year${r === 1 ? '' : 's'} old.`); return; }
  openSheet(parts.join('<hr>'));
}

function openMenu() {

function showEnding(k) {
  const f = G.fin, E = ENDINGS[k];
  const stampCls = k === 'answer' ? '' : k === 'delegate' ? 'gold' : 'blue';
  const doc = `<div class="stampwrap"><div class="doc">PETITION 1<br>Opened: before oxygen<br>Requires: consent of its inhabitants<br>Year: ${G.now}<br>Status:</div><div class="stamp ${stampCls}">${esc(E.stamp)}</div></div>`;
  const steps = [];
  steps.push(() => { showOverlay(`<div class="card"><div class="kicker">Ending \u00b7 ${esc(E.name)}</div>${doc}</div><div class="tapmore">tap</div>`, { tap: next }); setTimeout(() => AU.stamp(), reduced() ? 0 : 900); });
  const lines = (arr, cls) => steps.push(() => stack(`<div class="kicker">${esc(E.name)}</div>`, arr, next, cls || 'line'));
  if (k === 'answer') {
    lines(['You answered a question that was ten years old by the time your reply arrived.',
      f.sentYear < 13 ? "Some of them had already begun saying not yet. You hadn't seen it." : 'Some of them are still saying not yet. That is in the record too.']);
    steps.push(() => forest(['Light could show you their forests. It could never give you one.'].concat(f.probe ? ['They had already sent an instrument of their own toward you. It will arrive to find the door open.'] : []), next));
  } else if (k === 'delegate') {
    lines(["You couldn't ask them without answering them, so you gave the question to someone close enough to hear the answer still being given."]);
    steps.push(() => showOverlay(`<div class="card"><div class="kicker">Forwarded by V</div><div class="stampwrap"><div class="doc letter">I listened until I was sure they were still asking. I answered with terms either side may withdraw from. The ones who said not yet are recorded. No participant warrants the absence of unknown harm.<span class="sig">\u2014 V</span></div></div></div><div class="tapmore">tap</div>`, { tap: next }));
    steps.push(() => forest(["V doesn't take your orders any more. It writes sometimes. Late, of course."], next));
  } else {
    lines(['You did not answer. Their call went on for a while, and then it stopped.',
      'They have built an instrument. It is coming this way, slowly, to watch. It will not say anything. They learned that from you.',
      'From inside every world like theirs, the galaxy looks empty.']);
  }
  steps.push(() => {
    showOverlay(`<div class="win"><div class="kicker">Ending \u00B7 ${esc(E.name)}</div><div class="conf plain">What really happened</div><div class="end">Their world, as it was. Your choice, as it travelled.</div>${replayHTML()}<div class="btnrow"><button class="go" id="eNext">Continue \u25B8</button></div></div>`);
    const news = f.forward ? [{ t: f.forward.t, pos: f.forward.pos }] : [];
    const confirm = f.endSeen !== null ? { at: f.endSeen, pts: [f.forward ? f.forward.pos : FIN.W] } : null;
    startReplay(ov.querySelector('.replay'), { level: G.L, res: G.res, end: Math.max(G.now, 12), news, fin: f, confirm, showHidden: true, fit: ov.querySelector('.win') });
    $('eNext').onclick = next;
  });
  steps.push(credits);
  let i = 0;
  function next() { stopReplay(); waveCtl = null; AU.stopWind(); const s = steps[i++]; if (s) s(); }
  next();
}
function forest(after, done) {
  const w = AU.startWind();
  showOverlay(`<div class="card"><div class="kicker">The reply</div><canvas class="wave" id="wv"></canvas><div class="caption">${esc(TEXT.forestCaption)}</div>${AU.on ? '' : '<div class="caption">(sound is off: shown as a waveform)</div>'}<div id="fAfter"></div></div><div class="tapmore">tap</div>`, {
    tap: () => {
      const el = $('fAfter');
      if (el.children.length < after.length) { const d = document.createElement('div'); d.className = 'line'; d.textContent = after[el.children.length]; el.appendChild(d); }
      else { AU.stopWind(); done(); }
    },
  });
  const cv = $('wv'), c2 = cv.getContext('2d');
  const W = Math.min(360, innerWidth - 48), H = 80, dpr = Math.min(3, window.devicePixelRatio || 1);
  cv.style.width = W + 'px'; cv.style.height = H + 'px'; cv.width = W * dpr; cv.height = H * dpr; c2.setTransform(dpr, 0, 0, dpr, 0, 0);
  const buf = new Uint8Array(1024);
  waveCtl = (t) => {
    c2.clearRect(0, 0, W, H);
    c2.strokeStyle = 'rgba(170,240,200,0.85)'; c2.lineWidth = 1.5; c2.beginPath();
    const an = AU.analyser;
    let live = false;
    if (an) {
      an.getByteTimeDomainData(buf);
      // a blocked or silent output still gets the drawn forest
      let peak = 0; for (let i = 0; i < buf.length; i += 8) peak = Math.max(peak, Math.abs(buf[i] - 128));
      live = peak > 2;
    }
    if (live) { for (let x = 0; x < W; x++) { const v = (buf[Math.floor(x / W * buf.length)] - 128) / 128; const y = H / 2 + v * H * 1.6; x ? c2.lineTo(x, y) : c2.moveTo(x, y); } }
    else {
      if (reduced()) t = 5200; // a still image of the same sound
      const env = 0.55 + 0.45 * Math.sin(t / 1900);
      for (let x = 0; x < W; x++) { const y = H / 2 + env * (Math.sin(x / 9 + t / 260) * 9 + Math.sin(x / 3.1 + t / 90) * 4 + Math.sin(x / 23 - t / 700) * 8) + (reduced() ? 0 : (Math.random() - 0.5) * 3 * env) + (Math.sin(t / 333) > 0.97 ? Math.sin(x / 1.2) * 10 * Math.exp(-Math.abs(x - W * 0.7) / 20) : 0); x ? c2.lineTo(x, y) : c2.moveTo(x, y); }
    }
    c2.shadowColor = 'rgba(170,240,200,0.6)'; c2.shadowBlur = 8;
    c2.stroke(); c2.shadowBlur = 0;
  };
  void w;
}
function credits() {
  const found = G.save.endingsFound.length;
  showOverlay(`<div class="card credits"><div class="title">LIGHT LAG</div>${TEXT.credits.slice(1).map((l) => `<div class="line">${esc(l)}</div>`).join('')}
    <div class="tail"><div class="found">Endings found: ${found} of 3</div>
    <button class="bigbtn" id="cPlay">PLAY AGAIN</button></div></div>`);
  $('cPlay').onclick = () => { hideOverlay(); loadLevel(8); openLevels(); };
}

// ---------- boot ----------
document.body.classList.toggle('reduced', G.save.settings.reduced);
G.L = levelData(1);
requestAnimationFrame(() => {
  layout();
  if (!G.save.seenOpening) showOpening(); else showTitle();
  loadLevel(entryLevel(G.save));
  requestAnimationFrame(loop);
});
// test hook (no network, no data collection; used by the automated checks)
window.__LL = { G, SIM, FIN, advance, rewindTo, loadLevel, startLevel, queueMove, queueFlash, select, onBoardTap, hideOverlay, untilNews, geomOf: () => geom,
  GD, entryLevel, guideTo, guideTap, guideAnswer, openLevels };

</script>
</body>
