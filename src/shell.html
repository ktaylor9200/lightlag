<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>LIGHT LAG</title>
<style>
/*CSS*/
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button id="lvlname" class="ghost" aria-label="Level"></button>
    <div id="year" aria-live="polite"><span class="k">YEAR</span><b>0</b></div>
    <button id="menuBtn" class="iconbtn" aria-label="Menu"><span class="burger"></span></button>
    <div id="tickbar"></div>
  </header>
  <button id="obj" class="ghost"><span id="objtext"></span><span class="i" aria-hidden="true">i</span></button>
  <div id="boardwrap">
    <canvas id="board" aria-label="Board"></canvas>
    <div id="float"><div id="toast" class="hidden"></div><div id="coach" class="hidden"></div></div>
  </div>
  <div id="dock">
    <button id="log" class="ghost"><span class="sym" aria-hidden="true"></span><span id="logtext"></span><span id="logact"></span></button>
    <div id="outbox"></div>
    <div id="chips"></div>
    <div id="primaryRow">
      <button id="primary" class="primary">WAIT &#9656;</button>
      <button id="ff" class="secondary" aria-label="Until news">&#9656;&#9656;</button>
    </div>
  </div>
</div>
<div id="sheetBack" class="hidden"></div>
<div id="sheet" class="hidden" role="dialog"><div id="sheetGrip"></div><button id="sheetX" aria-label="Close">&#10005;</button><div id="sheetBody"></div></div>
<div id="overlay" class="hidden"></div>

</script>
</body>
</html>
