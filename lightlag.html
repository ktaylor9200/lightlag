<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>LIGHT LAG</title>
<style>
:root {
  --bg: #050a17; --panel: #0c1428; --panel2: #121c35; --line: rgba(160,185,230,0.16);
  --text: #dfe6f2; --dim: #8e9bb5; --gold: #f3d68c; --home: #fff3d6; --violet: #b993ff; --teal: #4fd8c8;
  --amber: #ffb547; --blue: #a8d2ff;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; -webkit-user-select: none; user-select: none; touch-action: manipulation; overscroll-behavior: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; opacity: 0.4; }
.hidden { display: none !important; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; padding: var(--sat) var(--sar) var(--sab) var(--sal); max-width: 560px; margin: 0 auto; }
#top { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 12px; }
#lvlname { flex: 1; min-width: 0; text-align: left; font-weight: 650; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 44px; }
#lvlname .n { color: var(--dim); font-weight: 500; margin-right: 6px; }
#year { font-variant-numeric: tabular-nums; letter-spacing: 0.08em; font-size: 13px; color: var(--dim); white-space: nowrap; }
#year b { color: var(--home); font-size: 18px; letter-spacing: 0.02em; margin-left: 2px; display: inline-block; min-width: 2ch; text-align: right; }
#year.bump b { animation: bump 0.4s ease; }
@keyframes bump { 0% { transform: translateY(-4px); opacity: 0.2; } 100% { transform: none; opacity: 1; } }
.iconbtn { width: 44px; height: 44px; font-size: 20px; border-radius: 12px; }
.iconbtn:active { background: var(--panel2); }
#obj { flex: none; text-align: left; padding: 2px 14px 6px; min-height: 30px; color: var(--text); font-size: 15px; }
#obj .i { color: var(--dim); font-size: 13px; margin-left: 4px; border: 1px solid var(--line); border-radius: 9px; padding: 0 6px; }
#boardwrap { flex: 1 1 auto; min-height: 160px; position: relative; display: flex; align-items: center; justify-content: center; }
#board { display: block; touch-action: none; }
#coach { position: absolute; left: 10px; right: 10px; top: 4px; background: rgba(12,20,40,0.94); border: 1px solid rgba(255,243,214,0.35); color: var(--home); border-radius: 14px; padding: 10px 14px; font-size: 15px; line-height: 1.35; box-shadow: 0 6px 24px rgba(0,0,0,0.5); animation: fadein 0.3s ease; z-index: 2; }
#coach .more { display: block; color: var(--dim); font-size: 12px; margin-top: 4px; letter-spacing: 0.04em; }
#coach.tap { cursor: pointer; }
#toast { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); background: rgba(12,20,40,0.94); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 15px; color: var(--text); max-width: 92%; text-align: center; pointer-events: none; animation: fadein 0.2s ease; z-index: 2; }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
#toast { transform: translateX(-50%); }
#dock { flex: none; padding: 4px 10px 8px; display: flex; flex-direction: column; gap: 6px; }
#log { display: flex; align-items: center; gap: 8px; text-align: left; min-height: 44px; padding: 4px 8px; border-radius: 12px; background: rgba(12,20,40,0.6); border: 1px solid var(--line); }
#log .sym { color: var(--home); opacity: 0.8; flex: none; }
#logtext { flex: 1; min-width: 0; font-size: 15px; color: #c9d3e6; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#logtext.fresh { animation: fadein 0.35s ease; }
#logact:empty { display: none; }
#logact { flex: none; }
#logact button { min-height: 36px; padding: 0 10px; border-radius: 10px; background: var(--home); color: #1b1408; font-weight: 700; font-size: 13px; }
#outbox, #chips { display: flex; flex-wrap: nowrap; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
#outbox::-webkit-scrollbar, #chips::-webkit-scrollbar { display: none; }
#outbox > *, #chips > * { flex: none; }
#chips > .answerBtn { flex: 1; }
#outbox:empty, #chips:empty { display: none; }
.chip { min-height: 44px; min-width: 44px; justify-content: center; padding: 0 14px; border-radius: 22px; border: 1px solid var(--line); background: var(--panel); font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: var(--gold); color: #241a00; border-color: var(--gold); }
.chip.violet { border-color: rgba(185,147,255,0.6); color: #e2d4ff; }
.chip.violet.on { background: var(--violet); color: #1b0f33; }
.chip.blue { border-color: rgba(168,210,255,0.6); color: var(--blue); }
.chip.out { background: rgba(243,214,140,0.08); border-color: rgba(243,214,140,0.45); color: var(--gold); font-weight: 600; padding-right: 4px; }
.chip.out .x { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border-radius: 18px; color: var(--dim); font-size: 16px; }
.chip.out .x:active { background: rgba(255,255,255,0.08); }
.chip:active { filter: brightness(1.25); }
#primaryRow { display: flex; gap: 8px; }
.primary { flex: 1; height: 54px; border-radius: 16px; background: var(--home); color: #1b1408; font-weight: 800; font-size: 17px; letter-spacing: 0.08em; box-shadow: 0 0 0 1px rgba(255,243,214,0.4), 0 6px 22px rgba(255,236,200,0.12); }
.primary.tx { background: var(--gold); }
.primary.pend { background: #dbe8ff; }
.primary.listen { background: #c9f2dd; }
.primary.pulse { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(255,243,214,0.55), 0 0 28px rgba(255,236,200,0.4); } }
.primary:active { transform: scale(0.985); }
.secondary { width: 64px; height: 54px; border-radius: 16px; background: var(--panel2); border: 1px solid var(--line); font-size: 15px; letter-spacing: -0.1em; color: var(--home); }
.answerBtn { height: 48px; border-radius: 14px; border: 1px solid rgba(168,210,255,0.6); color: var(--blue); background: rgba(168,210,255,0.08); font-weight: 700; letter-spacing: 0.04em; width: 100%; }
/* sheet */
#sheetBack { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 10; animation: fadein 0.2s ease; }
#sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-width: 560px; margin: 0 auto; max-height: 72%; display: flex; flex-direction: column; background: var(--panel); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 6px 16px calc(14px + var(--sab)); animation: up 0.25s cubic-bezier(.2,.8,.2,1); box-shadow: 0 -10px 40px rgba(0,0,0,0.5); }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
#sheetGrip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 10px; flex: none; }
#sheetBody { overflow-y: auto; -webkit-overflow-scrolling: touch; user-select: text; -webkit-user-select: text; }
#sheetBody h2 { font-size: 18px; margin: 2px 0 6px; font-weight: 700; }
#sheetBody h2 .k { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: var(--dim); display: block; margin-bottom: 2px; text-transform: uppercase; }
#sheetBody p { margin: 6px 0; color: #c9d3e6; }
#sheetBody .age { color: var(--home); }
#sheetBody .rule { border-left: 2px solid var(--violet); padding-left: 10px; color: #e2d4ff; }
#sheetBody .tagline { color: var(--gold); font-size: 14px; }
.menu { display: flex; flex-direction: column; gap: 6px; }
.menu button, .sheetBtn { min-height: 48px; text-align: left; padding: 0 14px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); font-size: 15px; display: flex; align-items: center; justify-content: space-between; }
.menu button .v { color: var(--dim); font-size: 14px; }
.btnrow { display: flex; gap: 8px; margin-top: 12px; }
.btnrow button { flex: 1; min-height: 50px; border-radius: 14px; font-weight: 700; background: var(--panel2); border: 1px solid var(--line); }
.btnrow button.go { background: var(--home); color: #1b1408; border-color: transparent; }
.btnrow button.blue { background: var(--blue); color: #0b1a2e; border-color: transparent; }
.loglist { font-size: 14px; }
.loglist div { padding: 6px 0; border-bottom: 1px solid rgba(160,185,230,0.07); color: #c9d3e6; }
.loglist .y { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; margin-right: 8px; }
.codex div { padding: 8px 0; border-bottom: 1px solid rgba(160,185,230,0.07); }
.codex b { display: block; color: var(--home); font-size: 14px; }
.codex .locked { color: var(--dim); }
.lv { display: flex; flex-direction: column; gap: 6px; }
.lv button { min-height: 50px; text-align: left; padding: 0 14px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.lv .act { font-size: 11px; letter-spacing: 0.12em; color: var(--dim); margin: 8px 0 0 4px; text-transform: uppercase; }
.lv .num { color: var(--dim); width: 1.4em; font-variant-numeric: tabular-nums; }
.lv .done { margin-left: auto; color: var(--teal); }
.hints p { padding: 8px 12px; background: var(--panel2); border-radius: 10px; }
/* overlay cards */
#overlay { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: calc(24px + var(--sat)) 24px calc(24px + var(--sab)); text-align: center; animation: fadein 0.4s ease; }
#overlay.tapcard { cursor: pointer; }
.card { max-width: 420px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.card .line { font-size: 21px; line-height: 1.35; color: var(--home); animation: fadein 0.8s ease both; font-weight: 400; }
.card .sub { font-size: 16px; color: #c9d3e6; animation: fadein 0.8s ease both; }
.card .kicker { font-size: 12px; letter-spacing: 0.22em; color: var(--dim); text-transform: uppercase; }
.card .title { font-size: 40px; letter-spacing: 0.32em; font-weight: 300; color: var(--home); margin-right: -0.32em; text-shadow: 0 0 30px rgba(255,236,200,0.35); }
.card .ttl2 { font-size: 26px; font-weight: 600; color: var(--home); }
.tapmore { position: absolute; bottom: calc(22px + var(--sab)); left: 0; right: 0; font-size: 12px; letter-spacing: 0.18em; color: var(--dim); text-transform: uppercase; animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: 0.35; } }
.bigbtn { min-height: 54px; padding: 0 28px; border-radius: 16px; background: var(--home); color: #1b1408; font-weight: 800; letter-spacing: 0.08em; font-size: 16px; }
.ghostbtn { min-height: 48px; padding: 0 18px; border-radius: 14px; border: 1px solid var(--line); color: var(--text); }
.win { max-width: 440px; width: 100%; display: flex; flex-direction: column; gap: 10px; align-items: stretch; max-height: 100%; overflow-y: auto; justify-content: center; }
.win .head { font-size: 13px; letter-spacing: 0.22em; color: var(--teal); text-transform: uppercase; }
.win .when { font-size: 18px; color: var(--home); line-height: 1.35; }
.win .when b { color: var(--gold); font-weight: 700; }
.win .end { font-size: 15px; color: #c9d3e6; font-style: italic; }
.replay { position: relative; width: 100%; flex: 0 1 auto; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.replay canvas { border-radius: 14px; background: #050a17; border: 1px solid var(--line); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { min-height: 40px; padding: 0 12px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: var(--dim); }
.seg button.on { background: var(--panel2); color: var(--home); }
.scrub { display: flex; align-items: center; gap: 10px; width: 100%; }
.scrub input { flex: 1; accent-color: #fff3d6; height: 32px; }
.scrub .y { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--dim); min-width: 5.5em; text-align: right; }
.rlabel { font-size: 12px; color: var(--dim); min-height: 1.2em; }
.stampwrap { position: relative; padding: 26px 22px; border: 1px solid var(--line); border-radius: 6px; background: #0b1224; width: 100%; max-width: 360px; text-align: left; }
.stampwrap .doc { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; color: #b9c4d9; line-height: 1.6; }
.stamp { position: absolute; right: 12px; top: 40%; transform: rotate(-12deg) scale(1); border: 3px solid currentColor; color: #ff9d8a; padding: 6px 10px; font-weight: 900; letter-spacing: 0.12em; font-size: 17px; border-radius: 6px; animation: stamp 0.45s cubic-bezier(.3,1.6,.5,1) both; animation-delay: 0.6s; background: rgba(11,18,36,0.6); }
.stamp.blue { color: #9fd0ff; } .stamp.gold { color: var(--gold); }
@keyframes stamp { from { transform: rotate(-12deg) scale(2.4); opacity: 0; } to { transform: rotate(-12deg) scale(1); opacity: 1; } }
.wave { width: 100%; max-width: 360px; height: 80px; }
.caption { font-size: 14px; color: var(--dim); font-style: italic; }
.found { font-size: 13px; letter-spacing: 0.14em; color: var(--teal); text-transform: uppercase; }
.credits .line { font-size: 17px; }
.credits .title { font-size: 34px; }
@media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; } }
body.reduced * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
@media (max-height: 620px) { #obj { min-height: 24px; padding-bottom: 2px; } .primary, .secondary { height: 48px; } #log { min-height: 44px; } }

</style>

<body>
<div id="app">
  <header id="top">

</div>
<div id="sheetBack" class="hidden"></div>
<div id="sheet" class="hidden" role="dialog"><div id="sheetGrip"></div><div id="sheetBody"></div></div>
<div id="overlay" class="hidden"></div>
<script>
"use strict";
const LEVELS_JSON = [{"n":1,"act":1,"name":"As It Was","R":4,"drones":{"A":[-1,1]},"derelicts":[{"id":"D1","pos":[2,-3],"dir":"SE","period":3,"first":2},{"id":"D2","pos":[-4,5],"dir":"NE","period":3,"first":8}],"objective":{"type":"tag_any","text":"Tag a derelict."},"test_plans":{"naive: aim at what you see":[[0,"MOVE","A",[2,-4]]],"naive, then corrected at y2":[[0,"MOVE","A",[2,-4]],[2,"MOVE","A",[2,-1]]],"reference: wait for projection":[[2,"MOVE","A",[2,0]]],"second chance only (D2)":[[0,"MOVE","A",[2,-4]],[12,"MOVE","A",[2,-1]]]}},{"n":2,"act":1,"name":"Closer Than It Looks","R":4,"drones":{"A":[-1,0],"B":[-2,4]},"derelicts":[{"id":"D1","pos":[1,-4],"dir":"SE","period":3,"first":3},{"id":"D2","pos":[1,0],"dir":"SW","period":3,"first":3}],"watchers":[{"id":"m0","pos":[-3,-1],"kind":"mirror","hidden":true}],"objective":{"type":"tag","ids":["D1","D2"],"text":"Tag both derelicts."},"test_plans":{"naive: aim at what you see (y5)":[[5,"MOVE","A",[1,-3]],[5,"MOVE","B",[-1,2]]],"reference":[[6,"MOVE","B",[-3,4]],[7,"MOVE","A",[1,0]]]}},{"n":3,"act":1,"name":"Chorus","R":4,"drones":{"A":[-1,0],"B":[2,2]},"receivers":[{"id":"X","cell":[3,-1],"need":2}],"watchers":[{"id":"m1","pos":[-2,-1],"kind":"mirror","hidden":true}],"objective":{"type":"rec","id":"X","text":"Wake the old relay: two signals must reach it in the same year."},"test_plans":{"naive: flash both now":[[0,"FLASH","A",null],[0,"FLASH","B",null]],"reference":[[0,"FLASH","B",null],[2,"FLASH","A",null]]}},{"n":4,"act":1,"name":"Filed Noise","R":4,"drones":{"A":[0,-2],"B":[-2,3],"C":[3,1]},"derelicts":[{"id":"D","pos":[-3,-1],"dir":"E","period":3,"first":2}],"receivers":[{"id":"X","ride":"D","need":3}],"watchers":[{"id":"m2","pos":[-3,0],"kind":"mirror","hidden":true},{"id":"m3","pos":[2,2],"kind":"mirror","hidden":true}],"objective":{"type":"rec","id":"X","text":"A relay rides this derelict. Three signals, one year."},"test_plans":{"naive: flash all at y5":[[5,"FLASH","A",null],[5,"FLASH","B",null],[5,"FLASH","C",null]],"reference (sends after projection)":[[5,"FLASH","C",null],[6,"FLASH","B",null],[9,"FLASH","A",null]]}},{"n":5,"act":2,"name":"Standing","R":4,"drones":{},"watchers":[{"id":"P","pos":[3,-3],"kind":"precedent"},{"id":"S","pos":[-3,1],"kind":"sign"}],"objective":{"type":"sign","text":"Ask both watchers. Collect both signatures."},"test_plans":{"naive: ask both at once":[[0,"PING","HOME","P"],[0,"PING","HOME","S"]],"wrong order":[[0,"PING","HOME","S"],[1,"PING","HOME","P"]],"reference":[[0,"PING","HOME","P"],[1,"PING","HOME","S"]]}},{"n":6,"act":2,"name":"No Universal Now","R":4,"drones":{"X":[4,-4],"Y":[0,-1]},"watchers":[{"id":"P","pos":[3,-3],"kind":"precedent"},{"id":"Q","pos":[0,-3],"kind":"precedent"}],"objective":{"type":"sign","text":"Each insists on being asked first. Satisfy both."},"test_plans":{"naive: both drones now":[[0,"FLASH","X","P"],[0,"FLASH","Y","Q"]],"Home asks both, P first":[[0,"PING","HOME","P"],[1,"PING","HOME","Q"]],"Home asks both, Q first":[[0,"PING","HOME","Q"],[1,"PING","HOME","P"]],"one drone does both":[[0,"FLASH","X","P"],[0,"MOVE","X",[1,-3]],[9,"FLASH","X","Q"]],"reference":[[0,"FLASH","X","P"],[2,"FLASH","Y","Q"]],"alt: drone + Home":[[0,"FLASH","X","P"],[3,"PING","HOME","Q"]]}},{"n":7,"act":2,"name":"The Knot","R":4,"drones":{"X":[2,-4],"Y":[0,-1],"Z":[4,-1]},"watchers":[{"id":"P","pos":[2,-3],"kind":"precedent"},{"id":"Q","pos":[0,-2],"kind":"precedent"},{"id":"R","pos":[3,-1],"kind":"precedent","split":{"tick":6,"id":"R2","pos":[3,0],"kind":"sign"}}],"objective":{"type":"sign","text":"Three precedents. Every party must sign."},"test_plans":{"naive: all three now":[[0,"FLASH","X","P"],[0,"FLASH","Y","Q"],[0,"FLASH","Z","R"]],"solve P,Q,R but miss the split":[[0,"FLASH","X","P"],[3,"FLASH","Y","Q"],[0,"FLASH","Z","R"]],"reference":[[0,"FLASH","X","P"],[3,"FLASH","Y","Q"],[0,"FLASH","Z","R"],[9,"PING","HOME","R2"]]}}];
// LIGHT LAG — rules simulator. Faithful port of reference/sim.py, plus two
// finale-only extensions (STANDING orders and the independent drone's own
// answer). Pure functions; no DOM. Shared by the game and the node tests.
const SIM = (() => {
  const DIRS = { E: [1, 0], NE: [1, -1], NW: [0, -1], W: [-1, 0], SW: [-1, 1], SE: [0, 1] };
  const HOME = [0, 0];
  const DRONE_STEP = 2;

  const eq = (a, b) => !!a && !!b && a[0] === b[0] && a[1] === b[1];
  function dist(a, b) {
    const dq = a[0] - b[0], dr = a[1] - b[1];
    return Math.max(Math.abs(dq), Math.abs(dr), Math.abs(dq + dr));
  }
  const ring = (p) => dist(p, HOME);
  // Python's round(): half to even
  function pyRound(x) {
    const f = Math.floor(x), d = x - f;
    if (d > 0.5) return f + 1;
    if (d < 0.5) return f;
    return f % 2 === 0 ? f : f + 1;
  }
  function cubeRound(x, y, z) {
    let rx = pyRound(x), ry = pyRound(y), rz = pyRound(z);
    const dx = Math.abs(rx - x), dy = Math.abs(ry - y), dz = Math.abs(rz - z);
    if (dx > dy && dx > dz) rx = -ry - rz;
    else if (dy > dz) ry = -rx - rz;
    else rz = -rx - ry;
    return [rx + 0, rz + 0];
  }
  function stepToward(a, b) {
    const n = dist(a, b);
    if (n === 0) return a;
    const ax = a[0] + 1e-6, az = a[1] + 2e-6, ay = -ax - az;
    const bx = b[0] + 1e-6, bz = b[1] + 2e-6, by = -bx - bz;
    const t = 1.0 / n;
    return cubeRound(ax + (bx - ax) * t, ay + (by - ay) * t, az + (bz - az) * t);
  }
  function path(a, b) {
    const out = [a];
    while (!eq(out[out.length - 1], b)) out.push(stepToward(out[out.length - 1], b));
    return out;
  }

  for (let k = 0; k < 12; k++) {
    pos = [pos[0] + dir[0], pos[1] + dir[1]]; t = nx; nx += d.period;

// LIGHT LAG — game state, UI and flow.
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
const ANIM = 380;

// ---------- persistence (graceful without storage) ----------
const SAVE_KEY = 'lightlag.v1';
let store = null;
try { store = window.localStorage; store.getItem(SAVE_KEY); } catch (e) { store = null; }
function loadSave() {
  let s = null;

  const d = { reached: 1, endingsFound: [], settings: { sound: true, reduced: false }, codex: [], cleared: [], tutorialDone: false, seenOpening: false };
  if (!s || typeof s !== 'object') return d;

}
function persist() { try { if (store) store.setItem(SAVE_KEY, JSON.stringify(G.save)); } catch (e) {} }

const G = {
  save: loadSave(), n: 1, L: null, plan: [], queue: [], now: 0, p: 1, animT0: 0,
  res: null, out: null, fin: null, unlock: {}, exitSeen: {}, exitTrue: {},
  sel: null, mode: 'move', logs: [], hint: 0, won: false, flags: {}, glintIdx: 0, tut: -1,
  locked: false, ff: null, finIntro: 3, ui: { tags: [], moveLines: [], highlight: [] }, outInfo: [],
};
AU.on = G.save.settings.sound;
const mqReduce = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
const reduced = () => G.save.settings.reduced || mqReduce.matches;
const actOf = (n) => (n <= 4 ? 1 : n <= 7 ? 2 : 3);
const levelData = (n) => (n === 8 ? FINALE_LEVEL : LEVELS_JSON[n - 1]);
const STARS = Array.from({ length: 70 }, () => [Math.random(), Math.random(), 0.15 + Math.random() * 0.5, Math.random() * 6]);

// ---------- canvas ----------
const canvas = $('board'), ctx = canvas.getContext('2d');
let geom = null;
function layout() {
  if (!G.L) return;
  const wrap = $('boardwrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  // size against the tallest dock so the board doesn't jump when chips appear
  const reserved = innerHeight - 48 - 32 - 236;
  let side = Math.min(w - 8, Math.max(reserved, 0));
  if (side < 240 || side > h) side = Math.min(w - 8, h - 4);
  side = Math.max(140, Math.floor(side));
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  canvas.style.width = side + 'px'; canvas.style.height = side + 'px';
  canvas.width = Math.round(side * dpr); canvas.height = Math.round(side * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  geom = makeGeom(side, side, G.L.R);
}
window.addEventListener('resize', () => { layout(); if (replayCtl) replayCtl.resize(); });
if (window.ResizeObserver) new ResizeObserver(() => layout()).observe($('boardwrap'));

function frame() {
  return {
    level: G.L, res: G.res, now: G.now, p: G.p, mode: 'seen', unlock: G.unlock, exitSeen: G.exitSeen, exitTrue: G.exitTrue,
    showHidden: false, fin: G.fin, clock: performance.now(), stars: STARS, ui: Object.assign({ selected: G.sel }, G.ui),
  };
}
function loop(t) {
  if (G.p < 1) G.p = Math.min(1, (t - G.animT0) / ANIM);
  if (G.L && geom && $('overlay').classList.contains('hidden')) render(ctx, geom, frame());
  if (replayCtl) replayCtl.tick(t);
  if (waveCtl) waveCtl(t);
  if (interCtl) interCtl(t);
  requestAnimationFrame(loop);
}

// ---------- level lifecycle ----------
function resim() {
  G.res = SIM.simulate(G.L, G.plan, 80);
  G.exitSeen = {}; G.exitTrue = {};
  for (const e of G.res.events) if (e.type === 'exit') { G.exitTrue[e.data] = e.t; G.exitSeen[e.data] = SIM.seenTick(e); }
  G.out = G.L.objective.type === 'finale' ? null : SIM.outcome(G.L, G.plan, 80, G.res);
  G.fin = G.L.world ? FIN.analyse(G.L, G.plan, G.res) : null;
}
function loadLevel(n) {
  stopFF(); stopHold();
  G.levelToken = (G.levelToken || 0) + 1;
  G.n = n; G.L = levelData(n); G.plan = []; G.queue = []; G.now = 0; G.p = 1; G.sel = null; G.mode = 'move';
  G.won = false; G.flags = { chg: {} }; G.glintIdx = 0; G.hint = 0; G.locked = false; G.logs = [];
  G.unlock = {};
  for (const d of G.L.derelicts || []) G.unlock[d.id] = SIM.firstSeenMove(G.L, d.id);
  G.tut = n === 1 && !G.save.tutorialDone ? 0 : -1;
  G.finIntro = n === 8 ? 0 : 3;
  resim(); layout(); clearCoach();
  for (const l of SCRIPT[n].startLog || []) addLog(l);
  if (G.tut === 0) setCoach('Tap your drone.');
  if (n === 8) finIntroShow();
  updateUI();
}

function advance() {
  finishAnim();
  const sent = G.queue.length;
  for (const o of G.queue) G.plan.push(Object.assign({ t: G.now }, o));
  G.queue = [];
  if (sent) { resim(); AU.thoom(); G.sel = null; G.mode = 'move'; }
  G.now++;
  G.p = reduced() ? 1 : 0; G.animT0 = performance.now();
  const yb = $('year'); yb.classList.remove('bump'); void yb.offsetWidth; yb.classList.add('bump');
  const news = processYear(G.now);
  tutorialAfterAdvance(sent);
  updateUI();
  return news;
}
function finishAnim() { G.p = 1; }

function processYear(n) {
  const res = G.res; let news = false;
  for (const e of res.events) if (e.t === n && e.type === 'order_rx') { news = true; AU.tick(); }
  let hiddenGlint = null, glint = false;
  for (const e of res.events) {
    if (SIM.seenTick(e) !== n) continue;
    if (e.type === 'flash' && SIM.eq(e.pos, SIM.HOME)) continue;
    news = true;
    if (e.type === 'glint') {
      const w = res.wat.find((q) => q.id === e.data);
      if (w && w.hidden) hiddenGlint = w; else glint = true;
    } else if (e.type === 'sign') { AU.sign(); addLog(`${nm(e.data)} signed. (Year ${e.t}, seen year ${n}.)`); }
    else if (e.type === 'offended') { AU.object(); onOffended(e); }
    else if (e.type === 'tag') addLog(`Seen: ${e.data[1]} tagged ${e.data[0]} in year ${e.t}.`);
    else if (e.type === 'rec_on') addLog(`Seen: the relay woke in year ${e.t}.`);
    else if (e.type === 'exit') onExit(e);
    else if (e.type === 'split') { addLog(`${nm(e.data[0])} has divided. ${nm(e.data[1])} has been independent since year ${e.t}. Nobody has asked it anything.`); unlockCodex('split'); setCoach(`${nm(e.data[0])} has divided. Requests addressed to ${nm(e.data[0])} do not count for ${nm(e.data[1])}.`, { dismiss: true }); }
    else if (e.type === 'declined') addLog(`${e.data[0]}: noted.`);
    else if (e.type === 'standing') addLog(`${e.data[0]} has accepted standing. Home can no longer calculate where it is.`);
  }
  if (hiddenGlint) {
    AU.chime();
    const lines = SCRIPT[G.n].glints || [];
    const t = G.glintIdx < lines.length ? lines[G.glintIdx] : 'Filed.';
    G.glintIdx++;
    addLog(t.replace('{ring}', SIM.ring(hiddenGlint.pos)));
  } else if (glint) AU.chime();
  // seen image changes: news + discoveries
  for (const key of Object.keys(res.hist)) {
    if (key.startsWith('wat:')) continue;
    const a = SIM.seenPos(res.hist[key], n - 1), b = SIM.seenPos(res.hist[key], n);
    if (!a || !b || SIM.eq(a[1], b[1])) continue;
    news = true;
    const chg = G.flags.chg[key] = G.flags.chg[key] || [];
    chg.push(n);
    if (key.startsWith('der:') && G.n >= 2 && chg.length >= 2 && chg[chg.length - 2] === n - 2 && SIM.ring(b[1]) < SIM.ring(a[1]) && !has('hurry')) {
      unlockCodex('hurry'); addLog(CODEX.hurry.b);
    }
    if (key.startsWith('drone:') && chg.length >= 2 && chg[chg.length - 2] === n - 1 && SIM.ring(b[1]) < SIM.ring(a[1]) && !has('fastdrone')) {
      unlockCodex('fastdrone'); addLog(CODEX.fastdrone.b);
    }
  }
  for (const id in G.unlock) if (G.unlock[id] === n) {
    news = true;
    if (G.tut < 0 || G.tut >= 4) addLog(`Home has now seen ${id} move. Its dashed marker shows where it is now.`);
  }
  if (G.out && G.out.confirmed_at_home === n && !G.won) onWin();

const has = (k) => G.save.codex.includes(k);
function unlockCodex(k) { if (!has(k)) { G.save.codex.push(k); persist(); } }

function onOffended(e) {
  const N = Math.min(...e.cause);
  const who = nm(e.data);
  addLog(e.tie ? `${who} objected. Two requests reached it in the same year, and a tie is not "first".` : `${who} objected. It heard someone else's request first.`,
    { label: `Rewind to year ${N}`, fn: () => rewindTo(N) });
  if (G.n === 6) {
    const askers = {};
    for (const o of G.plan) if (o.kind === 'FLASH' && o.arg) (askers[o.who] = askers[o.who] || new Set()).add(o.arg);
    if (Object.values(askers).some((s) => s.has('P') && s.has('Q')) && !has('departure')) { unlockCodex('departure'); addLog(CODEX.departure.b); }
  }
}
function onExit(e) {
  const id = e.data, d = G.res.ders.find((x) => x.id === id);
  if (d.tagged !== null) { addLog(`${id} has left the board.`); return; }
  const obj = G.L.objective;
  let fatal = false;
  if (obj.type === 'tag') fatal = obj.ids.includes(id);
  else if (obj.type === 'tag_any') fatal = (G.L.derelicts || []).every((x) => G.exitSeen[x.id] !== undefined && G.exitSeen[x.id] <= G.now && G.res.ders.find((y) => y.id === x.id).tagged === null);

  if (fatal) {
    const tx = G.plan.filter((o) => o.t < G.now).map((o) => o.t);
    const N = tx.length ? Math.max(...tx) : Math.max(0, ...Object.values(G.unlock).filter((x) => x !== null));
    addLog(`${id} has left the board ${obj.type === 'rec' ? 'with the relay asleep' : 'untagged'}.`, { label: `Rewind to year ${N}`, fn: () => rewindTo(N) });

function onWin() {
  G.won = true; stopFF(); AU.chord();
  const o = G.out;
  if (!G.save.cleared.includes(G.n)) G.save.cleared.push(G.n);
  G.save.reached = Math.max(G.save.reached, G.n + 1);
  if (G.n === 1) { G.save.tutorialDone = true; unlockCodex('dilation'); }
  if (G.n === 6) unlockCodex('lightcone');
  persist();
  addLog(`Confirmed. It happened in year ${o.happened_at}. You found out in year ${o.confirmed_at_home}.`);
  setCoach(`Confirmed. It happened in year ${o.happened_at}. You found out in year ${o.confirmed_at_home}.`);
  updateUI();
  const token = G.levelToken;
  setTimeout(() => { if (G.won && G.levelToken === token) showWin(); }, reduced() ? 400 : 1500);
}

function rewindTo(y) {
  if (G.locked) return;
  y = Math.max(0, Math.min(y, G.now));
  finishAnim(); stopFF();
  G.plan = G.plan.filter((o) => o.t < y); G.queue = []; G.now = y; G.won = false; G.sel = null; G.mode = 'move';
  if (G.tut >= 0 && G.tut < 4) { G.tut = 4; }
  clearCoach(); resim(); addLog(`Rewound to year ${y}.`); updateUI();
}

// ---------- tutorial (L1, first time) ----------

  else if (G.tut === 3 && G.now >= 2) {
    G.tut = 4;

    addLog(t); setCoach(t, { dismiss: true });

}
function tutTap(hex) {

    else toast('Tap your drone first: the gold triangle.');

    if (hex && sp && SIM.eq(hex, sp[1])) { queueMove('A', hex); G.tut = 2; setCoach('TRANSMIT. Your order travels at the speed of light.'); }
    else toast('Tap the derelict at the top.');
  } else if (G.tut === 2) toast('Tap TRANSMIT.');
  else if (G.tut === 3) toast('Tap WAIT.');
  updateUI();
}

// ---------- selection & orders ----------
function dronePosCalc(id) {
  if (G.fin && G.fin.standingAt !== null && G.now >= G.fin.standingAt) return null;
  return G.res.hist['drone:' + id][G.now] || null;
}
function droneAtHex(hex) {
  for (const id of Object.keys(G.L.drones || {})) { const c = dronePosCalc(id); if (c && SIM.eq(c, hex)) return id; }
  for (const id of Object.keys(G.L.drones || {})) { const s = SIM.seenPos(G.res.hist['drone:' + id], G.now); if (s && SIM.eq(s[1], hex)) return id; }
  return null;
}
function knownWatchers() {
  return G.res.wat.filter((w) => !w.hidden && (w.born === 0 || w.born + SIM.ring(w.pos) <= G.now));
}
function watcherAtHex(hex) { return knownWatchers().find((w) => SIM.eq(w.pos, hex)) || null; }
function select(id) {
  G.sel = id; G.mode = id === 'HOME' ? 'ask' : 'move';
  if (G.tut === 4 || G.tut < 0) clearCoachIfDismiss();
  AU.step(); updateUI();
}
function deselect() { G.sel = null; G.mode = 'move'; updateUI(); }
function queueMove(id, hex) {
  G.queue = G.queue.filter((o) => !(o.kind === 'MOVE' && o.who === id));
  G.queue.push({ kind: 'MOVE', who: id, arg: hex });
  AU.step(); updateUI();
}
function queueFlash(id, target) {
  if (id === 'HOME') {
    G.queue = G.queue.filter((o) => !(o.kind === 'PING' && o.arg === target));
    G.queue.push({ kind: 'PING', who: 'HOME', arg: target });
  } else {
    G.queue = G.queue.filter((o) => !(o.kind === 'FLASH' && o.who === id));
    G.queue.push({ kind: 'FLASH', who: id, arg: target });
  }
  AU.step();
  if (id === 'HOME') { G.sel = null; G.mode = 'move'; } else G.mode = 'move';
  updateUI();
}
function onBoardTap(x, y) {
  AU.init(); stopFF();
  if (!geom || G.locked) return;
  const hex = geom.hexAt(x, y);
  if (G.n === 8 && G.finIntro < 3) { finIntroNext(); return; }
  if (G.won) return;
  if (G.tut >= 0 && G.tut < 4) { tutTap(hex); return; }
  if (!hex) { deselect(); return; }
  const droneId = droneAtHex(hex);
  if (G.sel && G.sel !== 'HOME' && G.mode === 'move') {
    if (droneId === G.sel) { deselect(); return; }
    if (droneId) { select(droneId); return; }
    if (G.n === 8 && G.fin.standingAt !== null && G.now >= G.fin.standingAt) { toast('V has standing. It no longer takes your orders.'); return; }
    queueMove(G.sel, hex); return;
  }
  if (G.sel && G.mode === 'ask') {
    const w = watcherAtHex(hex);
    if (w) { queueFlash(G.sel, w.id); return; }
    if (droneId) { select(droneId); return; }
    toast('Ask cancelled.');
    if (G.sel === 'HOME') deselect(); else { G.mode = 'move'; updateUI(); }
    return;
  }
  if (droneId) { select(droneId); return; }
  if (SIM.eq(hex, SIM.HOME) && actOf(G.n) === 2) { select('HOME'); return; }
  if (G.sel) { deselect(); return; }
  inspect(hex);
}
canvas.addEventListener('click', (ev) => {
  const r = canvas.getBoundingClientRect();
  onBoardTap(ev.clientX - r.left, ev.clientY - r.top);
});

// ---------- arrival tags ----------
function unlockedNow(id) { const u = G.unlock[id]; return u !== null && u !== undefined && G.now >= u; }
function knownTargets() {
  const out = [];
  for (const r of G.L.receivers || []) {
    if (r.cell) out.push({ id: r.id, kind: 'fix', pos: r.cell, color: COL.relay });
    else if (SIM.seenPos(G.res.hist['der:' + r.ride], G.now)) out.push({ id: r.id, kind: 'ride', ride: r.ride, color: COL.relay });
  }
  for (const w of knownWatchers()) out.push({ id: w.id, kind: 'fix', pos: w.pos, born: w.born, color: '#dccbff' });
  if (G.L.world) out.push({ id: 'W', kind: 'fix', pos: FIN.W, color: COL.world });
  return out;
}
function rideArrival(res, derId, t0, src) {
  const h = res.hist['der:' + derId];
  for (let t = t0; t <= 80; t++) { const p = h[t]; if (!p) return null; if (t - t0 >= SIM.dist(src, p)) return t; }
  return null;
}
function computeTags() {
  const tags = [], lines = [], info = [];
  const q = G.queue.map((o) => Object.assign({ t: G.now, queued: true }, o));
  const all = G.plan.concat(q);
  const res = q.length ? SIM.simulate(G.L, all, 80) : G.res;
  const known = knownTargets();
  for (const o of all) {
    let txt = '';
    if (o.kind === 'MOVE') {
      const rx = res.events.find((e) => e.type === 'order_rx' && e.sent === o.t && e.data[0] === o.who && e.data[1] === 'MOVE');
      if (!rx) { if (o.queued) txt = ''; continue; }
      const later = res.events.filter((e) => e.type === 'order_rx' && e.data[0] === o.who && (e.data[1] === 'MOVE' || e.data[1] === 'STANDING') && e.sent > o.t).map((e) => e.t);
      const cutoff = later.length ? Math.min(...later) : 999;
      const h = res.hist['drone:' + o.who];
      let arr = null;
      for (let t = rx.t; t <= 80 && t < cutoff; t++) if (SIM.eq(h[t], o.arg)) { arr = t; break; }
      if (arr === null) continue;
      if (!o.queued && arr <= G.now) continue;
      tags.push({ pos: o.arg, text: `arrives yr ${arr}`, color: COL.drone, queued: !!o.queued });
      lines.push({ who: o.who, target: o.arg, queued: !!o.queued });
      txt = `arrives yr ${arr}`;
    } else if (o.kind === 'FLASH' || o.kind === 'PING') {
      let t0, src;
      if (o.kind === 'PING') { t0 = o.t; src = SIM.HOME; }
      else { const fe = res.events.find((e) => e.type === 'flash' && e.sent === o.t && e.data[0] === o.who); if (!fe) continue; t0 = fe.t; src = fe.pos; }
      for (const k of known) {
        let at, pos;
        if (k.kind === 'ride') {
          const tp = res.hist['der:' + k.ride][G.now];
          pos = unlockedNow(k.ride) && tp ? tp : (SIM.seenPos(res.hist['der:' + k.ride], G.now) || [0, null])[1];
          if (!pos) continue;
          at = unlockedNow(k.ride) ? rideArrival(res, k.ride, t0, src) : '?';
          if (at === null) continue;
        } else {
          pos = k.pos; at = t0 + SIM.dist(src, k.pos);
          if (k.born && at < k.born) continue;
        }
        if (!o.queued && at !== '?' && at < G.now) continue;
        const addressed = o.arg && k.id === o.arg;
        if (G.L.world && k.id === 'W' && !addressed) continue;
        tags.push({ pos, text: `${addressed ? '\u2192 ' : ''}reaches yr ${at}`, color: k.color, queued: !!o.queued });
        if (addressed || (!o.arg && k.kind !== 'fix') || (!o.arg && G.L.receivers && G.L.receivers.some((r) => r.id === k.id))) txt = `reaches ${nm(k.id)} yr ${at}`;
      }
    } else if (o.kind === 'STANDING') {
      const rx = res.events.find((e) => e.type === 'standing' && e.sent === o.t);
      if (rx) txt = `reaches V yr ${rx.t}`;
    }
    if (o.queued) info.push(txt);
  }
  return { tags, lines, info };
}

// ---------- UI ----------
function updateUI() {
  const L = G.L; if (!L) return;
  $('lvlname').innerHTML = `<span class="n">${G.n} \u00b7</span>${esc(L.name)}`;
  $('year').innerHTML = `YEAR <b>${G.now}</b>`;

  $('obj').innerHTML = `${esc(obj)} <span class="i">info</span>`;
  // tags

  if (G.tut === 1) { const sp = SIM.seenPos(G.res.hist['der:D1'], G.now); if (sp) hl.push(sp[1]); }

  const fin = G.fin, callSeen = G.n === 8 && G.now >= 10;
  const decisiveQueued = G.queue.some((o) => (o.arg === 'W') || o.kind === 'STANDING');
  const decisiveSent = fin && fin.sentYear !== null;

    if (actOf(G.n) === 2) chip('ASK', 'violet' + (G.mode === 'ask' ? ' on' : ''), () => { G.mode = G.mode === 'ask' ? 'move' : 'ask'; updateUI(); if (G.mode === 'ask') toast('Tap a watcher to address the request.'); });
    if (G.n === 8 && callSeen && !decisiveSent && !decisiveQueued) {

      chip('STANDING', 'blue', () => confirmSheet('Give standing', 'Give V the right to decide. It will no longer take your orders.', 'Give standing', () => { G.queue = G.queue.filter((o) => o.who !== 'V'); G.queue.push({ kind: 'STANDING', who: 'V', arg: null }); G.sel = null; updateUI(); }));
    }

  } else if (G.sel === 'HOME' && !G.won) {

    const hint = document.createElement('span'); hint.className = 'chip'; hint.style.border = '0'; hint.style.background = 'none'; hint.style.color = 'var(--dim)'; hint.style.fontWeight = '500';
    hint.textContent = 'Tap a watcher.'; ch.appendChild(hint);

  } else if (G.n === 8 && callSeen && !decisiveSent && !decisiveQueued && !G.locked && !G.won) {

    b.onclick = () => { AU.init(); confirmSheet('Answer them', 'This cannot be recalled. It reaches them in 5 years, and they will be ten years older than the voices you heard.', 'Send', () => { G.queue.push({ kind: 'PING', who: 'HOME', arg: 'W' }); updateUI(); }); };

  else if (G.n === 8 && decisiveSent) { lab = 'LISTENING \u25B8'; pr.classList.add('listen'); }
  else if (G.n === 8 && callSeen) { lab = 'PENDING \u25B8'; pr.classList.add('pend'); }
  if (G.locked) { pr.disabled = true; lab = G.n === 8 && !decisiveSent ? 'PENDING' : lab; }
  if (G.won) pr.disabled = true;
  if (G.tut === 2 || G.tut === 3) pr.classList.add('pulse');
  pr.textContent = lab;
  const ff = $('ff');
  ff.disabled = G.n === 8 || G.won || G.locked || (G.tut >= 0 && G.tut < 4);
  ff.classList.toggle('on', !!G.ff);
  renderLogLine();
}

// log
let logTimer = null, logShown = 0;
function addLog(text, action) {
  G.logs.push({ y: G.now, text, action: action || null });
  scheduleLogLine();
}
function scheduleLogLine() {
  if (logTimer) return;
  const step = () => {
    logTimer = null;
    if (logShown < G.logs.length - 1) { logShown++; renderLogLine(true); logTimer = setTimeout(step, 1500); }
    else if (logShown === G.logs.length - 1) renderLogLine(true);
  };
  if (logShown > G.logs.length - 1) logShown = G.logs.length - 1;
  if (logShown < G.logs.length - 2) logShown = G.logs.length - 2; // don't lag too far behind
  step();
}
function renderLogLine(fresh) {
  const l = G.logs[Math.min(logShown, G.logs.length - 1)];
  const lt = $('logtext'), la = $('logact');
  lt.textContent = l ? l.text : '';
  if (fresh) { lt.classList.remove('fresh'); void lt.offsetWidth; lt.classList.add('fresh'); }
  la.innerHTML = '';
  // the newest open action (smart rewind) stays reachable
  const act = [...G.logs].reverse().find((x) => x.action && !x.used && x.y <= G.now);
  if (act && !G.won) {
    const b = document.createElement('button'); b.textContent = act.action.label + ' \u21BA';
    b.onclick = (ev) => { ev.stopPropagation(); act.used = true; act.action.fn(); };
    la.appendChild(b);
  }
}

function seenAgo(key) {

  }

      ${seenAgo('wat:' + w.id)}${st ? `<p>${st.type === 'sign' ? 'Signed' : 'Objected'} in year ${st.t}. Seen in year ${SIM.seenTick(st)}.</p>` : ''}${tagsAt(hex)}`);
  }
  if (L.world && SIM.eq(hex, FIN.W)) {
    parts.push(`<h2><span class="k">Ring 5</span>A pale blue world</h2><p>Everything you know about it is five years old. Anything you say reaches it five years from now.</p>${G.now >= 10 ? '<p class="rule">It is asking. Some of it is saying not yet.</p>' : ''}${tagsAt(hex)}`);

  openSheet(parts.join('<hr style="border:0;border-top:1px solid var(--line);margin:12px 0">'));

  const exitSeen = {}, exitTrue = {};

    const maxW = Math.min(host.clientWidth || 340, 420);

    const side = Math.floor(Math.min(maxW, maxH));

  segs.forEach((x) => x.classList.toggle('on', x.dataset.m === mode));
  const ctl = {

    tick(t) {

      const now = Math.max(0, Math.ceil(v - 1e-9)), p = now === 0 ? 1 : v - now + 1;
      render(c2, g, { level: opts.level, res: opts.res, now, p, mode, unlock, exitSeen, exitTrue, showHidden: opts.showHidden, fin: opts.fin, clock: t, stars: STARS, newsEvents: opts.news, noLabels: true, ui: { tags: [], moveLines: [], highlight: [] } });

}

function finaleYear(n) {

  let news = false;
  const say = (t, coach) => { addLog(t); news = true; if (coach) setCoach(t, { dismiss: true }); };
  if (n === 6) say('It has started leaking radio. Not to us. To everyone.');
  if (f.calls.map((c) => c + FIN.WR).includes(n)) {
    AU.call();
    if (n === 10) { say('A pulse train: 2, 3, 5, 7. Primes. Decoded: IS ANYONE THERE?'); say('That one was aimed.', true); }
    else say('The call again. IS ANYONE THERE?');
  }
  if (FIN.NOTYET.map((c) => c + FIN.WR).includes(n)) {
    AU.notyet();
    if (n === 13) { say('A second voice, fainter. Amber. NOT YET.'); say('Not all of them.'); say('You could answer. You could wait. Or you could give the question to someone closer.', true); unlockCodex('stale'); }
    else say('The amber voice. NOT YET.');

  if (n === 19 && !sent) say('Waiting is the only choice that can be undone. It is still a choice.', true);
  if (n === 26 && !f.calls.map((c) => c + FIN.WR).includes(26) && f.sentYear === null) say('No call this year.');
  if (f.probe && n === FIN.PROBE_LAUNCH + FIN.WR) say('Something has left their world. It is coming this way. It appears to hurry. It is not hurrying.', !G.locked);
  if (sent && f.kind === 'answer' && f.A !== null && n > f.sentYear && n <= f.A) say(n < f.A ? `Your answer is ${n - f.sentYear} light-year${n - f.sentYear === 1 ? '' : 's'} out.` : 'Your answer has reached them. Now the light has to come back.');
  if (f.endSeen !== null && n === f.endSeen) finaleEnding(f.kind);
  if (n === FIN.HOLD_AT && !sent && !G.queue.length) startHold();
  return news;
}
let holdT = null;

// ---------- boot ----------
document.body.classList.toggle('reduced', G.save.settings.reduced);
G.L = levelData(1);
requestAnimationFrame(() => {
  layout();
  if (!G.save.seenOpening) showOpening(); else showTitle();
  loadLevel(Math.min(8, G.save.reached));
  requestAnimationFrame(loop);
});
// test hook (no network, no data collection; used by the automated checks)
window.__LL = { G, SIM, FIN, advance, rewindTo, loadLevel, startLevel, queueMove, queueFlash, select, onBoardTap, hideOverlay, untilNews, geomOf: () => geom };

</script>
